<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b6082">
<title>Healthcare Bill Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- QR code generator (classic script, exposes window.QRCode) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  /* =================================================================
     DESIGN TOKENS
     ================================================================= */
  :root {
    --brand: #1b6082; --brand-600: #164f6b; --brand-700: #0f3a50; --brand-50: #eef6fa; --brand-100: #d6eaf3; --brand-200: #a9d2e4;
    --ink: #0f172a; --text: #1e293b; --muted: #64748b; --subtle: #94a3b8;
    --line: #e2e8f0; --line-2: #cbd5e1;
    --bg: #f4f7fb; --surface: #ffffff; --surface-2: #f8fafc;
    --ok: #16a34a; --ok-600: #15803d; --ok-50: #ecfdf3; --ok-100: #d1fadf;
    --warn: #d97706; --warn-600: #b45309; --warn-50: #fffbeb; --warn-100: #fef3c7;
    --bad: #e11d48; --bad-50: #fff1f2;
    --gold: #f5b400;
    --r-xs: 8px; --r-sm: 12px; --r: 16px; --r-lg: 22px; --r-xl: 28px;
    --sh-1: 0 1px 2px rgba(15, 23, 42, .05), 0 1px 3px rgba(15, 23, 42, .06);
    --sh-2: 0 2px 6px rgba(15, 23, 42, .05), 0 10px 30px rgba(15, 23, 42, .08);
    --sh-3: 0 10px 40px rgba(15, 23, 42, .18);
    --font: "Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
    --ease: cubic-bezier(.2, .8, .2, 1);
    --spring: cubic-bezier(.3, 1.4, .5, 1);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--brand); }
  [hidden] { display: none !important; }
  svg.i { width: 1.1em; height: 1.1em; flex: 0 0 auto; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  :focus-visible { outline: 3px solid color-mix(in srgb, var(--brand) 45%, transparent); outline-offset: 2px; }

  /* =================================================================
     SHARED COMPONENTS
     ================================================================= */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    height: 38px; padding: 0 14px; border-radius: var(--r-sm); border: 1px solid var(--line);
    background: var(--surface); color: var(--text); font-weight: 600; font-size: 14px;
    cursor: pointer; text-decoration: none; white-space: nowrap; box-shadow: var(--sh-1);
    transition: background .15s, border-color .15s, transform .1s, box-shadow .15s;
  }
  .btn:hover { border-color: var(--line-2); background: var(--surface-2); }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  .btn.primary:hover { background: var(--brand-600); }
  .btn.ghost { background: transparent; border-color: transparent; box-shadow: none; }
  .btn.ghost:hover { background: rgba(15, 23, 42, .05); }
  .btn.danger { color: var(--bad); }
  .btn.danger:hover { background: var(--bad-50); border-color: #fecdd3; }
  .btn.danger-solid { background: var(--bad); border-color: var(--bad); color: #fff; }
  .btn.sm { height: 32px; padding: 0 10px; font-size: 13px; border-radius: 10px; }
  .btn.icon { width: 38px; padding: 0; }
  .btn.sm.icon { width: 32px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; }
  .chip.brand { background: var(--brand-50); border-color: var(--brand-100); color: var(--brand-700); }
  .chip.ok { background: var(--ok-50); border-color: var(--ok-100); color: var(--ok-600); }
  .chip.warn { background: var(--warn-50); border-color: var(--warn-100); color: var(--warn-600); }
  .chip .sw { width: 10px; height: 10px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .spacer { flex: 1; }
  .muted { color: var(--muted); }

  /* toasts */
  .toasts { position: fixed; z-index: 1000; right: 16px; top: 72px; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: none; max-width: calc(100vw - 32px); }
  .toast { pointer-events: auto; display: flex; gap: 10px; align-items: flex-start; background: var(--ink); color: #fff; padding: 12px 14px; border-radius: var(--r-sm); box-shadow: var(--sh-3); font-size: 14px; max-width: 420px; animation: toastIn .3s var(--spring); }
  .toast .i { margin-top: 1px; }
  .toast.ok .i { color: #4ade80; } .toast.err { background: #881337; } .toast.err .i { color: #fda4af; }
  @keyframes toastIn { from { transform: translateY(12px) scale(.96); opacity: 0; } }

  /* confirm modal */
  dialog.confirm { border: none; border-radius: var(--r-lg); padding: 0; width: min(420px, calc(100vw - 32px)); box-shadow: var(--sh-3); }
  dialog.confirm::backdrop { background: rgba(15, 23, 42, .45); backdrop-filter: blur(2px); }
  .confirm-body { padding: 22px 22px 8px; }
  .confirm-body h3 { margin: 0 0 6px; font-size: 18px; color: var(--ink); }
  .confirm-body p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
  .confirm-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 16px 22px 20px; }

  .demo-banner { position: fixed; left: 12px; bottom: 12px; z-index: 900; background: var(--warn-50); color: var(--warn-600); border: 1px solid var(--warn-100); font-size: 12px; font-weight: 600; padding: 6px 10px; border-radius: 99px; cursor: pointer; box-shadow: var(--sh-1); }

  /* figures (sprite canvas or drawn SVG) */
  .fig svg { display: block; height: 100%; width: auto; overflow: visible; }
  .fig canvas.sprite { display: block; height: 100%; width: auto; max-width: 100%; object-fit: contain; object-position: 50% 100%; }
  .fig.confused > :not(.scene) { animation: shake .45s ease-in-out 3; }
  .fig.cheer > :not(.scene) { animation: hop .6s var(--ease) 2; }
  /* background scenes */
  .scene { position: absolute; inset: 0; z-index: 0; overflow: hidden; border-radius: inherit; pointer-events: none; }
  .scene svg, .pc-scene svg { display: block; width: 100% !important; height: 100% !important; }
  .fig.joy > svg { animation: bounce 1.4s ease-in-out infinite; }
  @keyframes shake { 0%,100% { transform: translateX(0) } 25% { transform: translateX(-5px) rotate(-1.5deg) } 75% { transform: translateX(5px) rotate(1.5deg) } }
  @keyframes hop { 0%,100% { transform: translateY(0) } 40% { transform: translateY(-10%) } }
  @keyframes bounce { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-4%) } }
  @keyframes pop { 0% { transform: scale(.92); opacity: 0 } 100% { transform: scale(1); opacity: 1 } }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }

  /* confetti */
  .confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 5; }
  .confetti i { position: absolute; top: -12px; width: 8px; height: 12px; border-radius: 2px; animation: fall var(--d, 1.8s) var(--ease) forwards; }
  @keyframes fall { to { transform: translate(var(--x, 0), var(--y, 420px)) rotate(var(--r, 540deg)); opacity: 0; } }

  /* =================================================================
     DISPLAY — main screen (projector)
     ================================================================= */
  .display { height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
    background: radial-gradient(1200px 600px at 10% -10%, #dff0f7 0%, transparent 60%), radial-gradient(900px 500px at 110% 110%, #e6f4ec 0%, transparent 55%), var(--bg); }
  .d-top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 1.6vh 2vw 1vh; }
  .d-brand { display: flex; align-items: center; gap: 1vw; }
  .d-logo { width: 5.2vh; height: 5.2vh; border-radius: 1.4vh; background: var(--brand); display: grid; place-items: center; font-size: 3vh; box-shadow: var(--sh-2); user-select: none; cursor: default; }
  .d-title { font-size: min(3vh, 1.9vw); font-weight: 800; color: var(--ink); letter-spacing: -.02em; line-height: 1.1; }
  .d-sub { font-size: min(1.7vh, 1.05vw); color: var(--muted); font-weight: 500; }
  .d-meta { display: flex; align-items: center; gap: .7vw; }
  .d-pill { display: inline-flex; align-items: center; gap: .5vw; height: 4.2vh; padding: 0 1.1vw; border-radius: 99px; background: var(--surface); box-shadow: var(--sh-1); font-weight: 700; font-size: min(1.8vh, 1.1vw); color: var(--text); border: 1px solid var(--line); }
  .d-pill .dot { width: 1vh; height: 1vh; border-radius: 50%; background: var(--subtle); }
  .d-pill.live { background: var(--ok-50); color: var(--ok-600); border-color: var(--ok-100); }
  .d-pill.live .dot { background: var(--ok); animation: pulse 1.4s infinite; }
  .d-pill.paused { background: var(--warn-50); color: var(--warn-600); border-color: var(--warn-100); }
  .d-pill.paused .dot { background: var(--warn); }
  .d-tool { width: 4.2vh; height: 4.2vh; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; color: var(--muted); cursor: pointer; opacity: .6; transition: opacity .2s; font-size: 2vh; }
  .d-tool:hover { opacity: 1; }

  .stage { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1.4vw; padding: .6vh 2vw 2.2vh; }
  .pcard { position: relative; display: grid; grid-template-rows: auto 15.5vh minmax(0, 1fr) auto 19vh auto; min-width: 0; background: var(--surface);
    border-radius: var(--r-xl); box-shadow: var(--sh-2); border: 1px solid rgba(15, 23, 42, .06); padding: 1.6vh 1.1vw 1.4vh; overflow: hidden;
    transition: box-shadow .3s, transform .3s var(--spring); }
  .pcard.empty { opacity: .45; }
  /* flip card: front = live game, back = answer walkthrough for the facilitator */
  .pwrap { position: relative; min-width: 0; perspective: 2000px; }
  .flipper { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .8s var(--ease); }
  .pwrap.flipped .flipper { transform: rotateY(180deg); }
  .flipper > .pcard { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .pwrap.flipped .flipper > .pcard:not(.back) { pointer-events: none; }
  .pcard.back { transform: rotateY(180deg); display: flex; flex-direction: column; gap: 1.2vh; cursor: pointer; background: linear-gradient(180deg, #fff 0, var(--surface-2) 100%); }
  .pc-foot { cursor: default; user-select: none; }
  .bk-head { display: flex; align-items: center; gap: .8vw; }
  .bk-head .fig { height: 7.5vh; flex: 0 0 auto; }
  .bk-who { min-width: 0; flex: 1; }
  .bk-who b { display: block; font-size: min(2.3vh, 1.4vw); color: var(--ink); line-height: 1.1; }
  .bk-who small { display: block; font-size: min(1.45vh, .9vw); color: var(--muted); font-weight: 600; margin-top: .3vh; }
  .bk-btn { height: 3.8vh; padding: 0 .8vw; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: min(1.5vh, .92vw); color: var(--text); cursor: pointer; display: inline-flex; align-items: center; gap: .4vw; white-space: nowrap; }
  .bk-btn:hover { border-color: var(--brand); color: var(--brand); }
  .bk-btn.icon { width: 3.8vh; padding: 0; justify-content: center; }
  .bk-list { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 1vh; }
  .bk-q { display: grid; grid-template-columns: auto 1fr; gap: .4vh .7vw; padding: 1.2vh .8vw; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); transition: box-shadow .3s, border-color .3s; }
  .bk-q.next { border-color: var(--brand-200); box-shadow: 0 0 0 3px var(--brand-50); }
  .bk-q .n { grid-row: span 3; width: 3.2vh; height: 3.2vh; border-radius: 50%; background: var(--brand-50); color: var(--brand); display: grid; place-items: center; font-weight: 800; font-size: min(1.5vh, .9vw); }
  .bk-q.shown .n { background: var(--ok); color: #fff; }
  .bk-q .q { font-weight: 700; color: var(--ink); font-size: min(1.85vh, 1.12vw); line-height: 1.3; }
  .bk-q .a { justify-self: start; padding: .4vh .8vw; border-radius: 99px; background: var(--ok-50); color: var(--ok-600); font-weight: 800; font-size: min(2.2vh, 1.35vw); animation: pop .35s var(--spring); }
  .bk-q .calc { color: var(--text); font-size: min(1.65vh, 1vw); line-height: 1.45; white-space: pre-line; background: var(--surface-2); border-left: 3px solid var(--ok); border-radius: 0 var(--r-xs) var(--r-xs) 0; padding: .6vh .7vw; animation: pop .35s var(--spring); }
  .bk-q .hidden-ans { justify-self: start; padding: .4vh .8vw; border-radius: 99px; border: 1px dashed var(--line-2); color: var(--subtle); font-weight: 700; font-size: min(1.5vh, .92vw); }
  .bk-foot { display: flex; justify-content: space-between; align-items: center; gap: .6vw; font-size: min(1.5vh, .92vw); font-weight: 700; color: var(--muted); padding-top: .4vh; }
  .bk-foot .tip { display: inline-flex; align-items: center; gap: .4vw; }
  .bk-empty { flex: 1; display: grid; place-items: center; color: var(--muted); text-align: center; }
  .pcard.confused { box-shadow: 0 0 0 3px var(--warn), var(--sh-2); animation: shake .45s ease-in-out 2; }
  .pcard.done { box-shadow: 0 0 0 3px var(--ok), var(--sh-2); }
  .pc-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 1.1vh; min-width: 0; }
  .team-chip { display: inline-flex; align-items: center; gap: .5vw; min-width: 0; height: 3.6vh; padding: 0 .9vw; border-radius: 99px; background: var(--brand-50); color: var(--brand-700); font-weight: 800; font-size: min(1.75vh, 1.05vw); }
  .team-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rank { font-size: min(3vh, 1.8vw); line-height: 1; }

  .bubble { position: relative; background: var(--brand); color: #fff; border-radius: var(--r-lg); padding: 1.4vh 1.1vw; display: flex; flex-direction: column; justify-content: center; text-align: center;
    font-size: min(2.25vh, 1.3vw); line-height: 1.28; font-weight: 600; box-shadow: 0 8px 20px rgba(27, 96, 130, .25); animation: pop .35s var(--spring); margin: 0 .2vw 0 1.4vw; }
  .bubble::after { content: ""; position: absolute; left: 18%; bottom: -1.6vh; width: 3vh; height: 2vh; background: inherit; clip-path: polygon(0 0, 100% 0, 15% 100%); }
  .bubble .qnum { font-size: .66em; opacity: .85; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; margin-bottom: .5vh; }
  .bubble.confused { background: var(--warn); box-shadow: 0 8px 20px rgba(217, 119, 6, .3); }
  .bubble.done { background: var(--ok); box-shadow: 0 8px 20px rgba(22, 163, 74, .3); }
  .bubble.idle { background: var(--surface-2); color: var(--muted); box-shadow: none; border: 1px dashed var(--line-2); }

  .pc-mid { position: relative; display: flex; align-items: flex-end; justify-content: space-between; gap: .6vw; min-height: 0; padding: 2.6vh .5vw 0; }
  .pc-scene { position: absolute; left: 0; right: 0; top: 1.2vh; bottom: 0; border-radius: var(--r-lg); overflow: hidden; }
  .pc-mid > .spot, .pc-mid > .qr-wrap { position: relative; z-index: 1; }
  .pc-mid.has-bg .qr-label { background: rgba(255, 255, 255, .92); border-radius: 99px; padding: .2vh .6vw; color: var(--text); white-space: nowrap; }
  .spot { position: relative; height: 100%; min-width: 0; flex: 1 1 auto; display: flex; align-items: flex-end; justify-content: center; }
  .spot::before { content: ""; position: absolute; left: 50%; bottom: 0; width: 80%; height: 2.2vh; transform: translateX(-50%); border-radius: 50%; background: radial-gradient(closest-side, rgba(15, 23, 42, .16), transparent); }
  .spot .fig { position: relative; height: 100%; min-width: 0; display: flex; align-items: flex-end; justify-content: center; }
  .qr-wrap { display: flex; flex-direction: column; align-items: center; gap: .5vh; width: 32%; max-width: 13vh; flex: 0 0 auto; margin-bottom: .4vh; }
  .qr-box { width: 100%; aspect-ratio: 1; background: #fff; padding: 6%; border-radius: var(--r-sm); box-shadow: var(--sh-1); border: 1px solid var(--line); }
  .qr-box img, .qr-box canvas { width: 100% !important; height: auto !important; display: block; }
  .qr-box .qr-fallback { font-size: 1vh; word-break: break-all; color: var(--muted); }
  .qr-label { font-size: min(1.4vh, .85vw); text-align: center; color: var(--muted); font-weight: 600; }
  .hide-qr .qr-wrap { display: none; }

  .pc-name { text-align: center; padding: 1.2vh 0 1vh; }
  .pc-name b { display: block; font-weight: 800; font-size: min(3vh, 1.8vw); color: var(--ink); letter-spacing: -.01em; line-height: 1.1; }
  .pc-name small { display: block; font-weight: 600; font-size: min(1.6vh, 1vw); color: var(--muted); margin-top: .3vh; }

  .situation { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r); padding: 1.2vh .9vw; overflow: auto; min-height: 0; }
  .situation h3 { display: flex; align-items: center; gap: .5vw; margin: 0 0 .7vh; font-size: min(1.5vh, .95vw); font-weight: 800; color: var(--brand); text-transform: uppercase; letter-spacing: .08em; }
  .situation .sit-text { font-size: min(1.85vh, 1.12vw); line-height: 1.4; white-space: pre-line; color: var(--text); }
  .situation.hint { background: var(--warn-50); border-color: var(--warn-100); animation: pop .3s var(--spring); }
  .situation.hint h3 { color: var(--warn-600); }

  .pc-foot { padding-top: 1.4vh; }
  .steps { position: relative; display: flex; gap: .35vw; height: 1.2vh; margin-top: 1.6vh; }
  .steps .seg { flex: 1; border-radius: 99px; background: var(--line); overflow: hidden; }
  .steps .seg i { display: block; height: 100%; width: 0; background: var(--brand); border-radius: 99px; transition: width .7s var(--spring); }
  .steps .seg.on i { width: 100%; }
  .pcard.done .steps .seg i { background: var(--ok); }
  .steps .marker { position: absolute; top: -1.9vh; width: 1.6vh; height: 1.2vh; transform: translateX(-50%); background: var(--brand-700); clip-path: polygon(0 0, 100% 0, 50% 100%); transition: left .8s var(--spring); }
  .pc-stats { display: flex; justify-content: space-between; margin-top: .9vh; font-size: min(1.55vh, .95vw); font-weight: 700; color: var(--muted); }
  .pc-stats .wrong { color: var(--warn-600); }

  .center-msg { grid-column: 1 / -1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 14px; color: var(--muted); font-size: 18px; }
  .center-msg .big { font-size: 56px; }

  /* debrief */
  .debrief { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; padding: 2.2vh 2vw; overflow: auto;
    background: radial-gradient(1200px 600px at 0% 0%, #dff0f7 0%, transparent 60%), var(--bg); animation: pop .35s var(--ease); }
  .debrief-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.8vh; }
  .debrief-head h2 { margin: 0; font-size: min(3.4vh, 2.2vw); color: var(--ink); letter-spacing: -.02em; }
  .debrief-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1.2vw; flex: 1; min-height: 0; }
  .db-col { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--sh-2); overflow: auto; display: flex; flex-direction: column; border: 1px solid rgba(15, 23, 42, .06); }
  .db-head { display: flex; gap: .9vw; align-items: center; padding: 1.4vh 1vw; border-bottom: 1px solid var(--line); }
  .db-head .fig { height: 9vh; flex: 0 0 auto; }
  .db-head h3 { margin: 0; font-size: min(2.3vh, 1.4vw); color: var(--ink); }
  .db-head .meta { font-size: min(1.5vh, .95vw); color: var(--muted); font-weight: 600; }
  .db-sit { padding: 1.1vh 1vw; font-size: min(1.6vh, 1vw); background: var(--brand-50); color: var(--brand-700); white-space: pre-line; line-height: 1.4; }
  .db-q { display: grid; grid-template-columns: auto 1fr; gap: .2vh .7vw; padding: 1.2vh 1vw; border-top: 1px solid var(--line); font-size: min(1.7vh, 1.05vw); }
  .db-q .n { grid-row: span 3; width: 3vh; height: 3vh; border-radius: 50%; background: var(--brand-50); color: var(--brand); display: grid; place-items: center; font-weight: 800; font-size: .85em; }
  .db-q .q { font-weight: 700; color: var(--ink); }
  .db-q .a { justify-self: start; margin-top: .4vh; padding: .3vh .7vw; border-radius: 99px; background: var(--ok-50); color: var(--ok-600); font-weight: 800; font-size: 1.1em; }
  .db-q .e { color: var(--muted); margin-top: .3vh; white-space: pre-line; line-height: 1.4; }

/* =====================================================================
   2. DATA LAYER — same small API for Firebase and the local demo store
   ===================================================================== */
async function makeFirebaseStore() {
  const base = `https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/`;
  const [{ initializeApp }, fs] = await Promise.all([
    import(base + "firebase-app.js"),
    import(base + "firebase-firestore.js"),
  ]);
  const app = initializeApp(firebaseConfig);
  const db = fs.getFirestore(app);
  const ref = p => fs.doc(db, p);
  return {
    mode: "firebase",
    watchDoc: (p, cb) => fs.onSnapshot(ref(p), s => cb(s.exists() ? s.data() : null), showError),
    watchCol: (c, cb) => fs.onSnapshot(fs.collection(db, c), qs => cb(qs.docs.map(d => ({ ...d.data(), id: d.id }))), showError),
    set: (p, d) => fs.setDoc(ref(p), d),
    merge: (p, d) => fs.setDoc(ref(p), d, { merge: true }),
    del: p => fs.deleteDoc(ref(p)),
    newId: c => fs.doc(fs.collection(db, c)).id,
    now: () => fs.serverTimestamp(),
    // fn(currentData) -> { write?: newData, result }
    tx: (p, fn) => fs.runTransaction(db, async t => {
      const r = ref(p); const s = await t.get(r);
      const out = fn(s.exists() ? s.data() : null);
      if (out.write) t.set(r, out.write);
      return out.result;
    }),
  };
}

function makeLocalStore() {
  const P = "hcgame:";
  const subs = new Set();
  const get = p => { try { const v = localStorage.getItem(P + p); return v ? JSON.parse(v) : null; } catch { return null; } };
  const ping = () => queueMicrotask(() => subs.forEach(f => f()));
  const put = (p, d) => { localStorage.setItem(P + p, JSON.stringify(d)); ping(); };
  window.addEventListener("storage", e => { if (!e.key || e.key.startsWith(P)) ping(); });
  const sub = f => { subs.add(f); queueMicrotask(f); return () => subs.delete(f); };
  const listCol = c => {
    const out = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(P + c + "/")) out.push({ ...get(k.slice(P.length)), id: k.slice(P.length + c.length + 1) });
    }
    return out;
  };
  return {
    mode: "local",
    watchDoc: (p, cb) => sub(() => cb(get(p))),
    watchCol: (c, cb) => sub(() => cb(listCol(c))),
    set: async (p, d) => put(p, d),
    merge: async (p, d) => put(p, { ...(get(p) || {}), ...d }),
    del: async p => { localStorage.removeItem(P + p); ping(); },
    newId: () => Math.random().toString(36).slice(2, 12),
    now: () => Date.now(),
    tx: async (p, fn) => { const out = fn(get(p)); if (out.write) put(p, out.write); return out.result; },
  };
}

/* Answer checking: numbers compared numerically ($ and commas ignored, optional ± tolerance);

function toNum(s) {
  const t = String(s ?? "").replace(/sgd|s\$|\$|,|\s/gi, "");
  return /^-?\d*\.?\d+$/.test(t) ? parseFloat(t) : null;
}

  const alts = String(q?.answer ?? "").split("|").map(s => s.trim()).filter(Boolean);
  const tol = Math.abs(parseFloat(q?.tolerance)) || 0;

  return alts.some(a => {
    const an = toNum(a);
    if (an !== null && n !== null) return Math.abs(an - n) <= tol + 1e-9;

}) : null;

    <div class="bill-lines">${(b.lines || []).filter(l => l.label || l.amount).map(l => {
      const amt = String(l.amount ?? "").trim();
      const unknown = amt === "?" || amt === "";
      return `<div class="bl bl-${esc(l.kind || "item")}"><div class="lbl">${esc(l.label)}${l.note ? `<small>${esc(l.note)}</small>` : ""}</div>${l.kind === "note" && !amt ? "" : `<div class="amt ${unknown ? "unknown" : ""}">${esc(unknown ? "?" : amt)}</div>`}</div>`;
    }).join("")}</div>
    <div class="bill-foot">Sample bill for training purposes only. Hospital names are fictional.</div>
  </div>`;
}

const gameSub = g => { const t = String(g?.subtitle || "").trim(); return t === "-" ? "" : t || DEFAULT_SUB; };
const isNumericQ = q => !!q && toNum(String(q.answer).split("|")[0]) !== null;
const displayAnswer = q => {
  const alts = String(q?.answer ?? "").split("|").map(s => s.trim()).filter(Boolean);
  if (!alts.length) return "—";
  const first = alts[0], n = toNum(first);
  return n !== null && !/[a-z]/i.test(first.replace(/sgd/i, "")) ? "$" + n.toLocaleString("en-SG", { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 }) : first;
};

function moodByProgress(step, total) {
  if (!total) return "ok";
  const f = step / total;
  if (f >= 1) return "joy";
  if (f === 0) return "worried";
  if (f < 0.5) return "anxious";
  if (f < 0.75) return "ok";
  return "happy";
}

   Each draws on a 160 x 120 canvas; the floor starts around y = 94, where the character stands. */
const R = (x, y, w, h, f, extra = "") => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}"${extra}/>`;
const gridR = (x, y, cols, rows, w, h, gx, gy, f) => { let s = ""; for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) s += R(x + c * (w + gx), y + r * (h + gy), w, h, f); return s; };
const tiles = (y, f, line, step = 16) => { let s = R(0, y, 160, 120 - y, f); for (let x = step; x < 160; x += step) s += R(x, y, 1, 120 - y, line); s += R(0, y + Math.round((120 - y) / 2), 160, 1, line); return s; };
const tree = (x, y, r, leaf = "#6fae5a", dark = "#5c9a4a") => R(x - 2, y, 4, 22, "#8a6a4a") + `<circle cx="${x}" cy="${y}" r="${r}" fill="${dark}"/><circle cx="${x - 2}" cy="${y - 2}" r="${r - 2}" fill="${leaf}"/>`;
const cloud = (x, y) => R(x, y, 18, 4, "#fff") + R(x + 4, y - 3, 10, 3, "#fff");
const hdb = (x, y, w, h, body, stripe, win = "#9fb6c3") => {
  let s = R(x, y, w, h, body) + R(x, y, w, 3, stripe);
  for (let yy = y + 7; yy < y + h - 4; yy += 8) { s += R(x, yy + 5, w, 1, stripe); s += gridR(x + 3, yy, Math.floor((w - 4) / 7), 1, 4, 4, 3, 0, win); }
  return s;
};

const ANIMS = {

function loadSheet(key, skin) {

    img.onload = () => { try { res(recolorSheet(img, SPRITES[key].skin, hexRGB(skinHex(skin)))); } catch { res(img); } };
    img.onerror = () => res(null);

function recolorSheet(img, ref, target) {
  const c = document.createElement("canvas");
  c.width = img.naturalWidth; c.height = img.naturalHeight;
  const x = c.getContext("2d"); x.drawImage(img, 0, 0);

    if (!p[i + 3]) continue;
    const r = p[i] / 255, g = p[i + 1] / 255, b = p[i + 2] / 255;
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, dd = mx - mn;
    if (l < 0.22 || l > 0.85 || dd === 0) continue;
    const sat = l > 0.5 ? dd / (2 - mx - mn) : dd / (mx + mn);
    if (sat < 0.25 || sat > 0.65) continue;
    let h = mx === r ? ((g - b) / dd) % 6 : mx === g ? (b - r) / dd + 2 : (r - g) / dd + 4;

}

setInterval(() => {

    const btn = $("#sheetIn button");
    if (btn) btn.onclick = () => { hideSheet(); $("#ans")?.focus(); };
    if (autoHide) sheetTimer = setTimeout(hideSheet, autoHide);
  }
  function hideSheet() { clearTimeout(sheetTimer); $("#sheet").className = "sheet"; }

  function render() {
    const { s, ch, qs, total, step, done } = info();
    if (!game || !ch) {
      key = "";
      root.innerHTML = `<div class="t-state"><span class="emoji">⏳</span><h2>Almost ready</h2><p>Waiting for the facilitator to set up your character…</p></div>`;
      return;
    }
    const status = game.status || "waiting";
    const confused = p?.hintStep === step && !done;
    const k = [status, step, total, done, s.characterId, confused, ch.skin, ch.age, ch.gender, ch.bg, s.teamName, JSON.stringify(ch.bill || null)].join("|");
    if (k === key) return;
    const wasDone = key && key.split("|")[3] === "true";
    key = k;
    const mood = done ? "joy" : confused ? "confused" : status !== "live" ? "talk" : moodByProgress(step, total);
    const q = qs[step];
    const numeric = isNumericQ(q);
    root.innerHTML = `
      <header class="t-top">
        <div class="t-team">${esc(s.teamName || `Team ${slot + 1}`)}</div>
        <div class="t-steps" aria-label="${step} of ${total} answered">${stepsHTML(step, total)}</div>
        <span class="t-count">${step}/${total}</span>
      </header>
      <section class="t-hero">
        <div class="t-stage">${sceneHTML(ch)}<div class="fig ${done ? "joy" : confused ? "confused" : ""}">${charFigure(ch, mood)}</div></div>
        <div class="t-id">
          <div class="t-name">${esc(ch.name)}</div>
          <div class="row">${ch.age ? `<span class="chip brand">${esc(ch.age)} years old</span>` : ""}</div>
          <button class="t-sit-btn" id="sitBtn" aria-expanded="${sitOpen}">Medical situation ${icon("chev")}</button>
        </div>
      </section>
      <div class="t-sit" id="sit" ${sitOpen ? "" : "hidden"}>${esc(ch.situation)}</div>
      ${done ? `<div class="t-state" id="doneCard"><span class="emoji">🎉</span><h2>All questions answered!</h2><p>${esc(ch.name)} finally understands the bill. Look at the main screen to see how the other teams are doing.</p></div>`
      : status !== "live" ? `<div class="t-state"><span class="emoji">${status === "paused" ? "⏸️" : "📄"}</span><h2>${status === "paused" ? "Game paused" : "Get your bill ready"}</h2><p>${status === "paused" ? "Hang tight, the facilitator will resume shortly." : "The facilitator will start the game in a moment. Read your patient's bill while you wait."}</p></div>`
      : `<div class="q-card"><div class="q-label">Question ${step + 1} of ${total}</div><div class="q-text">${esc(q.q)}</div></div>
         <form class="answer" id="ansForm" autocomplete="off">
           <div class="field">${numeric ? `<span class="prefix">$</span>` : ""}<input id="ans" ${numeric ? 'inputmode="decimal" placeholder="0.00"' : 'placeholder="Type your answer"'} enterkeyhint="send" aria-label="Your answer" required></div>
           <button class="btn-3d" id="sendBtn">Check answer</button>
         </form>`}
      ${ch.bill && ch.bill.show !== false ? `<details class="t-bill" id="billBox" ${billOpen ? "open" : ""}><summary><span>📄 ${esc(ch.name)}'s bill</span><span class="chev">${icon("chev")}</span></summary>${billHTML(ch)}</details>` : ""}`;
    $("#billBox")?.addEventListener("toggle", e => { billOpen = e.target.open; });
    $("#sitBtn").onclick = () => { sitOpen = !sitOpen; $("#sit").hidden = !sitOpen; $("#sitBtn").setAttribute("aria-expanded", sitOpen); };
    const form = $("#ansForm");
    if (form) form.onsubmit = e => { e.preventDefault(); submit($("#ans").value); };
    if (done && !wasDone) confetti($("#doneCard"), 60);
    if (confused && status === "live") {
      const tries = (p.history || []).filter(x => x.step === step && !x.ok).length;
      showSheet("wrong", `<h3><span class="ico">?</span>Hmm… are you sure?</h3>
        <p class="msg">${p.lastAnswer ? `“${esc(p.lastAnswer)}” isn't quite right.` : "That wasn't quite right."} ${plural(tries, "wrong try")} on this question.</p>
        ${q?.hint ? `<div class="hint"><b>💡 Hint:</b> ${esc(q.hint)}</div>` : ""}
        <button class="btn-3d warn">Try again</button>`);
    } else if ($("#sheet").classList.contains("wrong")) hideSheet();
  }

  async function submit(raw) {
    const ans = String(raw || "").trim();
    if (!ans || busy) return;
    busy = true; const btn = $("#sendBtn"); if (btn) btn.disabled = true;
    const expectedStep = info().step;
    try {
      const res = await DB.tx(PROG(slot), cur => {
        cur = cur || blankProgress();
        const qs = game?.slots?.[slot]?.character?.questions || [];
        if (game?.status !== "live") return { result: "notlive" };
        if ((cur.step || 0) !== expectedStep || !qs[expectedStep]) return { result: "stale" };
        const ok = checkAnswer(ans, qs[expectedStep]);
        const history = [...(cur.history || []), { step: expectedStep, answer: ans.slice(0, 60), ok, at: Date.now() }].slice(-60);
        const next = { ...blankProgress(), ...cur, attempts: (cur.attempts || 0) + 1, history, lastAnswer: ans.slice(0, 60), lastResult: ok ? "correct" : "wrong", lastAt: DB.now() };
        if (ok) { next.step = expectedStep + 1; if (next.step >= qs.length) next.finishedAt = DB.now(); }
        else { next.wrong = (cur.wrong || 0) + 1; next.hintStep = expectedStep; }
        return { write: next, result: ok ? "correct" : "wrong" };
      });
      navigator.vibrate?.(res === "correct" ? 40 : res === "wrong" ? [60, 50, 60] : 0);
      if (res === "stale") showSheet("info", `<h3><span class="ico">↻</span>Already answered</h3><p class="msg">A teammate got there first. Here's the current question.</p>`, 2500);
      if (res === "notlive") showSheet("info", `<h3><span class="ico">⏸</span>Not running</h3><p class="msg">The game isn't live right now.</p>`, 2500);
      if (res === "wrong") { key = ""; render(); }
    } catch (e) { showError(e); }
    finally { busy = false; const b = $("#sendBtn"); if (b) b.disabled = false; }
  }

  DB.watchDoc(GAME, g => { game = g; render(); });
  DB.watchDoc(PROG(slot), x => {
    const prev = p?.step;
    p = x;
    const now = x?.step || 0;
    if (prev != null && now > prev) {
      const { total } = info();
      showSheet("ok", `<h3><span class="ico">✓</span>${now >= total ? "Correct, that's the last one!" : "Correct!"}</h3><p class="msg">${now >= total ? "Great work, team." : "On to the next question."}</p>`, 1800);
    }
    render();
  });
}

    $("#lib").addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.matches("[data-open]")) { e.preventDefault(); e.target.click(); } });
    $("#newChar").onclick = () => openEditor(null);
    async function seed() {
      await Promise.all(sampleCharacters().map(c => DB.set(`${COL_CHARS}/${DB.newId(COL_CHARS)}`, { ...c, createdAt: Date.now(), updatedAt: Date.now() }))).catch(showError);
      toast("Added 4 sample characters.");
    }
    $("#seed").onclick = seed;
    $("#exp").onclick = () => {
      const data = JSON.stringify(lib.map(({ id, ...c }) => c), null, 2);
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([data], { type: "application/json" }));
      a.download = `healthcare-characters-${new Date().toISOString().slice(0, 10)}.json`;
      a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      toast(`Exported ${plural(lib.length, "character")}.`);
    };
    $("#imp").onchange = async e => {
      const file = e.target.files[0]; e.target.value = ""; if (!file) return;
      try {
        const arr = JSON.parse(await file.text());
        const list = (Array.isArray(arr) ? arr : [arr]).filter(c => c && c.name && Array.isArray(c.questions));
        await Promise.all(list.map(c => DB.set(`${COL_CHARS}/${DB.newId(COL_CHARS)}`, { ...snapshot(c), createdAt: Date.now() })));
        toast(`Imported ${plural(list.length, "character")}.`);
      } catch (err) { toast("Couldn't import that file: " + err.message, "err"); }
    };

    /* ----- character editor (slide-over) ----- */
    const drawer = $("#drawer"), scrim = $("#scrim");
    function openEditor(ch) {
      draft = ch ? structuredClone(ch) : { name: "", age: "", gender: "male", skin: DEFAULT_SKIN, bg: "hospital", situation: "", questions: DEFAULT_QUESTIONS(), bill: defaultBill() };
      if (!Array.isArray(draft.questions)) draft.questions = [];
      draft.questions.forEach((q, i) => q._k = q._k || Math.random().toString(36).slice(2));
      openQs = new Set(ch ? [] : draft.questions.filter(q => !q.answer).map(q => q._k));
      drawer.innerHTML = `
        <div class="dr-head"><h2>${draft.id ? "Edit character" : "New character"}</h2><button class="btn ghost icon" data-act="close" aria-label="Close">${icon("x")}</button></div>
        <div class="dr-body">
          <div class="sec">
            <div class="sec-title">Profile</div>
            <div class="profile">
              <div class="grid2">
                <label class="flabel">Name<input class="input" data-f="name" value="${esc(draft.name)}" placeholder="e.g. Mr Tan" maxlength="40"></label>
                <label class="flabel">Age<input class="input" data-f="age" type="number" min="0" max="120" value="${esc(draft.age)}" placeholder="e.g. 68"></label>
              </div>
              <div class="preview"><div class="scene" id="edScene"></div><div class="fig" id="edPreview"></div></div>
              <div class="flabel">Gender
                <div class="pills" role="radiogroup" aria-label="Gender">
                  <label><input type="radio" name="g" data-f="gender" value="male" ${draft.gender !== "female" ? "checked" : ""}><span>Male</span></label>
                  <label><input type="radio" name="g" data-f="gender" value="female" ${draft.gender === "female" ? "checked" : ""}><span>Female</span></label>
                </div></div>
              <div class="flabel">Skin tone
                <div class="skin-pick" role="radiogroup" aria-label="Skin tone">
                  ${SKIN_TONES.map((t, k) => `<label title="${t.label}"><input type="radio" name="skin" data-f="skin" value="${k + 1}" ${(+draft.skin || DEFAULT_SKIN) === k + 1 ? "checked" : ""} aria-label="${t.label}"><span style="background:${t.hex}"></span></label>`).join("")}
                </div></div>
            </div>
            <p class="help" style="margin:10px 0 0">The sprite is picked from gender and age: under 20 teen, 20–59 adult, 60+ elderly.</p>
          </div>
          <div class="sec">
            <div class="sec-title">Background</div>
            <div class="bg-grid" role="radiogroup" aria-label="Background">
              ${["", ...BG_ORDER].map(id => `<label class="bg-opt"><input type="radio" name="bg" data-f="bg" value="${id}" ${(draft.bg || "") === id ? "checked" : ""}><span class="bg-thumb">${id ? sceneSVG(id) : "None"}</span><span class="bg-name">${id ? esc(SCENES[id].label) : "Plain"}</span></label>`).join("")}
            </div>
            <p class="help" style="margin:8px 0 0">Shown behind the character on the main screen and on the team's phone.</p>
          </div>
          <div class="sec">
            <div class="sec-title">Opening line</div>
            <textarea class="textarea" data-f="intro" rows="2" placeholder="${esc(DEFAULT_INTRO)}">${esc(draft.intro || "")}</textarea>
            <p class="help" style="margin:6px 0 16px">What the character says in the speech bubble before the game starts. Leave blank for the default. <b>{name}</b> is replaced with the character's name.</p>
            <div class="sec-title">Thank-you line</div>
            <textarea class="textarea" data-f="outro" rows="2" placeholder="${esc(DEFAULT_OUTRO)}">${esc(draft.outro || "")}</textarea>
            <p class="help" style="margin:6px 0 16px">What the character says once the team has answered every question. Leave blank for the default. <b>{name}</b> works here too.</p>
            <div class="sec-title">Medical situation</div>
            <textarea class="textarea" data-f="situation" rows="3" placeholder="e.g. Singapore Citizen, admitted 4 days in a B2 ward for pneumonia.">${esc(draft.situation)}</textarea>
            <p class="help" style="margin:6px 0 0">Shown on the main screen under the character.</p>
          </div>
          <div class="sec" id="billSec"></div>
          <div class="sec">
            <div class="sec-title"><span>Questions</span><span class="help" style="text-transform:none;letter-spacing:0">Drag ${icon("grip")} to reorder</span></div>
            <div class="qlist" id="qlist"></div>
            <button type="button" class="add-q" data-act="addq" style="margin-top:10px;width:100%">${icon("plus")}Add question</button>
          </div>
        </div>
        <div class="dr-foot"><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="save">${icon("check")}Save character</button></div>`;
      renderQList(); renderPreview(); renderBillEd();
      drawer.classList.add("show"); scrim.classList.add("show"); drawer.setAttribute("aria-hidden", "false");
      setTimeout(() => drawer.querySelector('[data-f="name"]')?.focus(), 250);
    }
    function closeEditor() { drawer.classList.remove("show"); scrim.classList.remove("show"); drawer.setAttribute("aria-hidden", "true"); draft = null; }
    scrim.onclick = closeEditor;
    document.addEventListener("keydown", e => { if (e.key === "Escape" && draft && !document.querySelector("dialog[open]")) closeEditor(); });
    /* ----- medical bill editor ----- */
    function renderBillEd() {
      const el = $("#billSec"); if (!el) return;
      const b = draft.bill;
      if (!b) {
        el.innerHTML = `<div class="sec-title">Medical bill</div>
          <div class="empty-state" style="padding:22px"><p style="margin:0 0 12px">No bill yet. Teams will see the bill on their phones, under the answer box.</p>
          <button type="button" class="btn primary" data-bact="create">${icon("plus")}Create bill from template</button></div>`;
        return;
      }
      const custom = !hospitalOf(b.hospital);
      el.innerHTML = `
        <div class="sec-title"><span>Medical bill</span>
          <label class="switch" style="text-transform:none;letter-spacing:0;color:var(--text)"><input type="checkbox" data-bf="show" ${b.show !== false ? "checked" : ""}><span class="track"></span>Show to teams</label></div>
        <div class="bill-ed">
          <label class="flabel">Issuing hospital
            <select class="select" data-bf="hospSel">
              ${HOSPITALS.map(h => `<option value="${esc(h[1])}" ${b.hospital === h[1] ? "selected" : ""}>${esc(h[1])}</option>`).join("")}
              <option value="__custom" ${custom ? "selected" : ""}>Custom name…</option>
            </select></label>
          <label class="flabel" ${custom ? "" : "hidden"} id="hospCustomWrap">Custom hospital name<input class="input" data-bf="hospital" value="${esc(custom ? b.hospital : "")}" placeholder="e.g. Punggol Pretend Hospital"></label>
          <label class="flabel">Bill no.<input class="input" data-bf="billNo" value="${esc(b.billNo)}" placeholder="e.g. B123456"></label>
          <label class="flabel">Ward / class<input class="input" data-bf="ward" value="${esc(b.ward)}" placeholder="e.g. B2"></label>
          <label class="flabel">Admitted<input class="input" data-bf="admitted" value="${esc(b.admitted)}" placeholder="e.g. 03/03/2025"></label>
          <label class="flabel">Discharged<input class="input" data-bf="discharged" value="${esc(b.discharged)}" placeholder="e.g. 07/03/2025"></label>
        </div>
        <div class="sec-title" style="margin-top:16px"><span>Line items</span><span class="help" style="text-transform:none;letter-spacing:0">Type <b>?</b> as the amount for figures teams must work out</span></div>
        <div class="bill-head-row"><span>Description</span><span>Amount</span><span>Style</span><span></span></div>
        <div class="bill-rows">${b.lines.map((l, i) => `
          <div class="bill-row">
            <input class="input" data-bl="${i}" data-bk="label" value="${esc(l.label)}" placeholder="e.g. Less: MediShield Life claim" aria-label="Line ${i + 1} description">
            <input class="input" data-bl="${i}" data-bk="amount" value="${esc(l.amount)}" placeholder="-$1,200.00" aria-label="Line ${i + 1} amount" style="font-family:ui-monospace,Menlo,Consolas,monospace">
            <select class="select" data-bl="${i}" data-bk="kind" aria-label="Line ${i + 1} style">${BILL_KINDS.map(k => `<option value="${k[0]}" ${l.kind === k[0] ? "selected" : ""}>${k[1]}</option>`).join("")}</select>
            <div class="btns">
              <button type="button" class="btn sm ghost icon" data-bact="up" data-i="${i}" ${i === 0 ? "disabled" : ""} aria-label="Move line up">${icon("up")}</button>
              <button type="button" class="btn sm ghost icon" data-bact="down" data-i="${i}" ${i === b.lines.length - 1 ? "disabled" : ""} aria-label="Move line down">${icon("down")}</button>
              <button type="button" class="btn sm ghost icon danger" data-bact="del" data-i="${i}" aria-label="Remove line">${icon("trash")}</button>
            </div>
          </div>`).join("")}</div>
        <div class="row" style="margin-top:10px">
          <button type="button" class="btn sm" data-bact="add">${icon("plus")}Add line</button>
          <div class="spacer"></div>
          <button type="button" class="btn sm ghost" data-bact="template">${icon("rotate")}Reset to template</button>
          <button type="button" class="btn sm ghost danger" data-bact="remove">${icon("trash")}Remove bill</button>
        </div>
        <div class="sec-title" style="margin-top:16px">Preview (what teams see)</div>
        <div class="bill-preview" id="billPrev">${billHTML(draft)}</div>`;
    }
    const refreshBillPreview = () => { const el = $("#billPrev"); if (el) el.innerHTML = billHTML(draft); };
    drawer.addEventListener("input", e => {
      const t = e.target; if (!draft?.bill) return;
      const b = draft.bill;
      if (t.dataset.bf === "show") b.show = t.checked;
      else if (t.dataset.bf === "hospSel") {
        const custom = t.value === "__custom";
        $("#hospCustomWrap").hidden = !custom;
        if (!custom) b.hospital = t.value; else { b.hospital = $('[data-bf="hospital"]').value.trim() || "My Hospital"; $('[data-bf="hospital"]').focus(); }
      } else if (t.dataset.bf) b[t.dataset.bf] = t.value;
      else if (t.dataset.bl != null) b.lines[+t.dataset.bl][t.dataset.bk] = t.value;
      else return;
      refreshBillPreview();
    });
    drawer.addEventListener("click", async e => {
      const btn = e.target.closest("[data-bact]"); if (!btn || !draft) return;
      const act = btn.dataset.bact, i = +btn.dataset.i, L = draft.bill?.lines;
      if (act === "create") draft.bill = defaultBill();
      if (act === "add") L.push({ label: "", amount: "", kind: "item", note: "" });
      if (act === "up") [L[i - 1], L[i]] = [L[i], L[i - 1]];
      if (act === "down") [L[i + 1], L[i]] = [L[i], L[i + 1]];
      if (act === "del") L.splice(i, 1);
      if (act === "template") { if (!await ask("Reset the bill to the template?", "Your line items will be replaced with the standard template.", { ok: "Reset", danger: true })) return; draft.bill = defaultBill({ hospital: draft.bill.hospital, billNo: draft.bill.billNo, ward: draft.bill.ward, admitted: draft.bill.admitted, discharged: draft.bill.discharged }); }
      if (act === "remove") { if (!await ask("Remove this bill?", "Teams won't see a bill for this character.", { ok: "Remove", danger: true })) return; draft.bill = null; }
      renderBillEd();
      if (act === "add") $(".bill-rows")?.lastElementChild?.querySelector("input")?.focus();
    });
    function renderPreview() {
      const el = $("#edPreview"); if (el) el.innerHTML = charFigure(draft, "talk");
      const sc = $("#edScene"); if (sc) sc.innerHTML = sceneSVG(draft.bg);
    }
    function qSummary(q) {
      const bits = [];
      bits.push(q.answer ? `Answer: ${q.answer}` : "No answer yet");
      if (q.hint) bits.push("hint ✓");
      if (q.explain) bits.push("debrief ✓");
      return bits.join(" · ");
    }
    function renderQList() {
      const n = draft.questions.length;
      $("#qlist").innerHTML = draft.questions.map((q, i) => `
        <div class="qitem ${openQs.has(q._k) ? "open" : ""}" data-i="${i}">
          <div class="q-head" data-toggle="${i}">
            <span class="grip" draggable="true" data-drag="${i}" title="Drag to reorder" aria-hidden="true">${icon("grip")}</span>
            <span class="q-no">${i + 1}</span>
            <div class="q-sum"><b>${esc(q.q) || "<span class='muted'>New question</span>"}</b><small>${esc(qSummary(q))}</small></div>
            <button type="button" class="btn sm ghost icon" data-up="${i}" ${i === 0 ? "disabled" : ""} aria-label="Move question ${i + 1} up">${icon("up")}</button>
            <button type="button" class="btn sm ghost icon" data-down="${i}" ${i === n - 1 ? "disabled" : ""} aria-label="Move question ${i + 1} down">${icon("down")}</button>
            <span class="q-chev">${icon("chev")}</span>
          </div>
          <div class="q-body">
            <label class="flabel">Question the character asks<input class="input" data-qi="${i}" data-qf="q" value="${esc(q.q)}" placeholder="e.g. How much is MediShield Life covering?"></label>
            <div class="grid2">
              <label class="flabel">Correct answer(s)<input class="input" data-qi="${i}" data-qf="answer" value="${esc(q.answer)}" placeholder="e.g. 1200   or   Yes|Y"></label>
              <label class="flabel">Allowed ± margin<input class="input" data-qi="${i}" data-qf="tolerance" type="number" min="0" step="0.01" value="${esc(q.tolerance || 0)}"></label>
            </div>
            <label class="flabel">Hint (shown after a wrong answer)<textarea class="textarea" data-qi="${i}" data-qf="hint" rows="2">${esc(q.hint)}</textarea></label>
            <label class="flabel">Debrief explanation (optional)<textarea class="textarea" data-qi="${i}" data-qf="explain" rows="2" placeholder="Shown when you reveal answers">${esc(q.explain)}</textarea></label>
            <div class="row" style="justify-content:flex-end"><button type="button" class="btn sm danger" data-delq="${i}">${icon("trash")}Remove question</button></div>
          </div>
        </div>`).join("") || `<div class="empty-state" style="padding:24px"><p>No questions yet.</p></div>`;
    }
    drawer.addEventListener("input", e => {
      const t = e.target; if (!draft) return;
      if (t.dataset.f) draft[t.dataset.f] = t.dataset.f === "age" ? (t.value === "" ? "" : +t.value) : t.dataset.f === "skin" ? +t.value : t.value;
      if (["skin", "gender", "age", "bg"].includes(t.dataset.f)) renderPreview();
      if (t.dataset.f === "name") refreshBillPreview?.();
      if (t.dataset.qf) {
        const i = +t.dataset.qi;
        draft.questions[i][t.dataset.qf] = t.dataset.qf === "tolerance" ? (+t.value || 0) : t.value;
        const item = t.closest(".qitem");
        item.querySelector(".q-sum b").textContent = draft.questions[i].q || "New question";
        item.querySelector(".q-sum small").textContent = qSummary(draft.questions[i]);
        item.classList.remove("invalid");
      }
    });
    drawer.addEventListener("click", async e => {
      if (!draft) return;
      const b = e.target.closest("button, [data-toggle]"); if (!b) return;
      const qs = draft.questions;
      if (b.dataset.act === "close") return closeEditor();
      if (b.dataset.act === "save") return saveDraft();
      if (b.dataset.act === "addq") {
        const q = { q: "", answer: "", hint: "", explain: "", tolerance: 0, _k: Math.random().toString(36).slice(2) };
        qs.push(q); openQs.add(q._k); renderQList();
        const last = $("#qlist").lastElementChild; last?.scrollIntoView({ behavior: "smooth", block: "center" }); last?.querySelector("input")?.focus();
        return;
      }
      if (b.dataset.up) { e.stopPropagation(); const i = +b.dataset.up; [qs[i - 1], qs[i]] = [qs[i], qs[i - 1]]; return renderQList(); }
      if (b.dataset.down) { e.stopPropagation(); const i = +b.dataset.down; [qs[i + 1], qs[i]] = [qs[i], qs[i + 1]]; return renderQList(); }
      if (b.dataset.delq) {
        const i = +b.dataset.delq;
        if (!await ask(`Remove question ${i + 1}?`, qs[i].q || "This question will be removed.", { ok: "Remove", danger: true })) return;
        qs.splice(i, 1); return renderQList();
      }
      if (b.dataset.toggle != null && !e.target.closest(".grip")) {
        const k = qs[+b.dataset.toggle]._k;
        openQs.has(k) ? openQs.delete(k) : openQs.add(k);
        b.closest(".qitem").classList.toggle("open");
      }
    });
    // drag & drop reordering
    let dragFrom = null;
    drawer.addEventListener("dragstart", e => {
      const g = e.target.closest?.("[data-drag]"); if (!g) return;
      dragFrom = +g.dataset.drag;
      const item = g.closest(".qitem"); item.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", String(dragFrom));
      try { e.dataTransfer.setDragImage(item, 20, 20); } catch {}
    });
    drawer.addEventListener("dragover", e => {
      if (dragFrom == null) return;
      const item = e.target.closest(".qitem"); if (!item) return;
      e.preventDefault();
      drawer.querySelectorAll(".qitem").forEach(x => x.classList.remove("drop-before", "drop-after"));
      const r = item.getBoundingClientRect();
      item.classList.add(e.clientY < r.top + r.height / 2 ? "drop-before" : "drop-after");
    });
    drawer.addEventListener("drop", e => {
      if (dragFrom == null) return;
      const item = e.target.closest(".qitem"); if (!item) return;
      e.preventDefault();
      const r = item.getBoundingClientRect();
      let to = +item.dataset.i + (e.clientY < r.top + r.height / 2 ? 0 : 1);
      const qs = draft.questions; const [m] = qs.splice(dragFrom, 1);
      if (to > dragFrom) to--;
      qs.splice(to, 0, m);
      dragFrom = null; renderQList();
    });
    drawer.addEventListener("dragend", () => { dragFrom = null; drawer.querySelectorAll(".qitem").forEach(x => x.classList.remove("dragging", "drop-before", "drop-after")); });

    async function saveDraft() {
      if (!String(draft.name).trim()) { drawer.querySelector('[data-f="name"]').focus(); return toast("Give the character a name.", "err"); }
      if (!draft.questions.length) return toast("Add at least one question.", "err");
      const bad = draft.questions.findIndex(q => !String(q.q).trim() || !String(q.answer).trim());
      if (bad >= 0) {
        openQs.add(draft.questions[bad]._k); renderQList();
        const it = $("#qlist").children[bad]; it.classList.add("invalid"); it.scrollIntoView({ behavior: "smooth", block: "center" });
        return toast(`Question ${bad + 1} needs both a question and a correct answer.`, "err");
      }
      const id = draft.id || DB.newId(COL_CHARS);
      const data = { ...snapshot(draft), createdAt: draft.createdAt || Date.now() };
      try { await DB.set(`${COL_CHARS}/${id}`, data); } catch (err) { return showError(err); }
      const wasExisting = !!draft.id;
      closeEditor();
      toast(`Saved “${data.name}”.`);
      if (wasExisting && game?.slots?.some(s => s.characterId === id) &&
          await ask("Update the live game too?", `“${data.name}” is assigned to a team. Apply these changes to the running game now?`, { ok: "Update game", cancel: "Not now" })) {
        lib = lib.map(c => c.id === id ? { ...data, id } : c);
        resync(id);
      }
    }

    /* ----- subscriptions ----- */
    DB.watchDoc(GAME, g => {
      if (!g) { DB.set(GAME, defaultGame()).catch(showError); return; }
      game = g; renderCtl(); renderSlots(); renderLib(); renderHeading();
    });
    DB.watchCol(COL_CHARS, list => { lib = list; if (game) renderSlots(); renderLib(); });
    for (let i = 0; i < SLOTS; i++) DB.watchDoc(PROG(i), p => {
      if (!p) { DB.set(PROG(i), blankProgress()).catch(showError); return; }
      prog[i] = p; renderStats();
    });
  }
}

/* =====================================================================
   7. BOOT
   ===================================================================== */
const app = $("#app");
let DB;
try {
  DB = USE_FIREBASE ? await makeFirebaseStore() : makeLocalStore();
} catch (e) {
  app.innerHTML = `<div class="pin"><h1>Couldn't connect</h1><p class="muted">${esc(e.message)}</p></div>`;
  throw e;
}
const view = params.get("view") || (params.get("slot") ? "team" : "display");
({ display: viewDisplay, team: viewTeam, admin: viewAdmin }[view] || viewDisplay)();
if (DB.mode === "local") {
  const b = document.createElement("div");
  b.className = "demo-banner";
  b.textContent = "Demo mode: data stays in this browser (click to hide)";
  b.onclick = () => b.remove();
  document.body.appendChild(b);
}
</script>
</body>
</html>
