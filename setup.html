<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b6082">
<title>Induction Setup Checklist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Same design tokens as healthcare.html / guide.html */
  :root {
    --brand: #1b6082; --brand-600: #164f6b; --brand-700: #0f3a50; --brand-50: #eef6fa; --brand-100: #d6eaf3; --brand-200: #a9d2e4;
    --ink: #0f172a; --text: #1e293b; --muted: #64748b; --subtle: #94a3b8;
    --line: #cfdbe0; --line-2: #b8c7ce;
    --bg: #dde7eb; --surface: #f6f9fa; --surface-2: #ecf2f4;
    --ok: #16a34a; --ok-600: #15803d; --ok-50: #ecfdf3; --ok-100: #d1fadf;
    --warn: #d97706; --warn-600: #b45309; --warn-50: #fffbeb; --warn-100: #fef3c7;
    --bad: #e11d48; --bad-50: #fff1f2;
    --slot: #f6a531;
    --r-sm: 12px; --r: 16px; --r-lg: 22px;
    --sh-1: 0 1px 2px rgba(15,23,42,.05), 0 1px 3px rgba(15,23,42,.06);
    --sh-2: 0 2px 6px rgba(15,23,42,.05), 0 10px 30px rgba(15,23,42,.08);
    --sh-3: 0 10px 40px rgba(15,23,42,.18);
    --font: "Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
    --spring: cubic-bezier(.3, 1.4, .5, 1);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); -webkit-font-smoothing: antialiased; line-height: 1.45; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--brand); }
  [hidden] { display: none !important; }
  svg.i { width: 1.1em; height: 1.1em; flex: 0 0 auto; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  :focus-visible { outline: 3px solid color-mix(in srgb, var(--brand) 45%, transparent); outline-offset: 2px; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 38px; padding: 0 14px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--surface); color: var(--text); font-weight: 600; font-size: 14px; cursor: pointer; text-decoration: none; white-space: nowrap; box-shadow: var(--sh-1); transition: background .15s, border-color .15s, transform .1s; }
  .btn:hover { border-color: var(--line-2); background: var(--surface-2); }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  .btn.primary:hover { background: var(--brand-600); }
  .btn.ghost { background: transparent; border-color: transparent; box-shadow: none; }
  .btn.ghost:hover { background: rgba(15,23,42,.05); }
  .btn.danger { color: var(--bad); }
  .btn.danger:hover { background: var(--bad-50); border-color: #fecdd3; }
  .btn.danger-solid { background: var(--bad); border-color: var(--bad); color: #fff; }
  .btn.sm { height: 30px; padding: 0 10px; font-size: 13px; border-radius: 10px; }
  .btn.icon { width: 38px; padding: 0; } .btn.sm.icon { width: 30px; }
  .btn.dashed { border-style: dashed; background: transparent; box-shadow: none; color: var(--muted); }
  .btn.dashed:hover { color: var(--brand); border-color: var(--brand-200); background: var(--brand-50); }
  .chip { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; }
  .chip.brand { background: var(--brand-50); border-color: var(--brand-100); color: var(--brand-700); }
  .chip.ok { background: var(--ok-50); border-color: var(--ok-100); color: var(--ok-600); }
  .chip.warn { background: var(--warn-50); border-color: var(--warn-100); color: var(--warn-600); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .spacer { flex: 1; }
  .muted { color: var(--muted); }
  .input { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; background: #fff; font-size: 14px; font-weight: 500; color: var(--ink); transition: border-color .15s, box-shadow .15s; min-width: 0; }
  .input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-100); }
  .input.big { font-size: 22px; font-weight: 800; padding: 6px 10px; }
  .input.on-dark { background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.3); color: #fff; }
  .input.on-dark::placeholder { color: rgba(255,255,255,.65); }

  /* header */
  header { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--surface) 85%, transparent); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
  .hd { max-width: 1240px; margin: 0 auto; padding: 10px 20px; display: flex; align-items: center; gap: 12px; }
  .logo { width: 34px; height: 34px; border-radius: 10px; background: var(--brand); display: grid; place-items: center; font-size: 18px; flex: 0 0 auto; }
  .hd b { color: var(--ink); font-size: 16px; }
  .conn { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .conn .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px var(--ok-100); }
  .conn.local .dot { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-100); }
  .tabs { display: inline-flex; gap: 2px; padding: 3px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; }
  .tabs button { height: 32px; padding: 0 14px; border: none; background: none; border-radius: 9px; font-weight: 700; font-size: 14px; color: var(--muted); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
  .tabs button.on { background: var(--surface); color: var(--ink); box-shadow: var(--sh-1); }
  .btn.editing { background: var(--warn); border-color: var(--warn); color: #fff; }
  .menu { position: relative; }
  .menu-pop { position: absolute; right: 0; top: 44px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); box-shadow: var(--sh-3); padding: 6px; min-width: 280px; z-index: 30; }
  .menu-pop button { white-space: nowrap; }
  .menu-pop button { display: flex; width: 100%; gap: 10px; align-items: center; padding: 9px 10px; border: none; background: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; text-align: left; }
  .menu-pop button:hover { background: var(--surface-2); }
  .menu-pop hr { border: none; border-top: 1px solid var(--line); margin: 4px 0; }

  main { max-width: 1240px; margin: 0 auto; padding: 22px 20px 80px; }
  .editbar { background: var(--warn-50); border: 1px solid var(--warn-100); color: var(--warn-600); border-radius: var(--r-sm); padding: 10px 14px; font-size: 14px; font-weight: 600; margin-bottom: 16px; display: flex; gap: 10px; align-items: center; }

  /* hero */
  .hero { background: linear-gradient(135deg, var(--brand) 0%, #2a7aa1 100%); color: #fff; border-radius: var(--r-lg); padding: 24px 28px; box-shadow: var(--sh-2); margin-bottom: 20px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 20px; align-items: center; }
  .hero h1 { margin: 0 0 4px; font-size: 28px; letter-spacing: -.02em; line-height: 1.15; }
  .hero p { margin: 0; opacity: .92; font-size: 15px; }
  .hero .edit-stack { display: grid; gap: 8px; max-width: 640px; }
  .stats { display: flex; gap: 10px; flex-wrap: wrap; }
  .stat { background: rgba(255,255,255,.14); border-radius: 14px; padding: 10px 14px; min-width: 130px; }
  .stat small { display: block; font-size: 12px; opacity: .85; font-weight: 600; }
  .stat b { font-size: 22px; }
  .stat .bar { height: 6px; background: rgba(255,255,255,.25); border-radius: 9px; overflow: hidden; margin-top: 6px; }
  .stat .bar i { display: block; height: 100%; background: #fff; border-radius: 9px; }

  /* agenda */
  .legend { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--muted); margin: 0 0 12px; }
  .legend .sw { display: inline-block; width: 14px; height: 14px; border-radius: 4px; vertical-align: -2px; margin-right: 5px; }
  .agenda { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 520px), 1fr)); gap: 18px; align-items: start; }
  .day { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px; box-shadow: var(--sh-2); }
  .day-head { background: var(--day); color: #fff; border-radius: 14px; padding: 14px 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .day-head h2 { margin: 0; font-size: 22px; font-style: italic; font-weight: 700; }
  .day-head .date { opacity: .9; font-size: 14px; font-weight: 600; }
  .day-head .pre { margin-left: auto; background: rgba(255,255,255,.18); border: none; color: #fff; border-radius: 99px; padding: 5px 11px; font-size: 12px; font-weight: 700; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
  .day-head .pre:hover { background: rgba(255,255,255,.28); }
  .day-edit { display: grid; gap: 8px; width: 100%; }
  .swatches { display: flex; gap: 6px; align-items: center; }
  .swatches button { width: 22px; height: 22px; border-radius: 50%; border: 2px solid rgba(255,255,255,.6); cursor: pointer; padding: 0; }
  .swatches button.on { border-color: #fff; box-shadow: 0 0 0 2px rgba(0,0,0,.35); }
  .slots { display: grid; grid-template-columns: repeat(var(--n, 2), minmax(0, 1fr)); gap: 12px; margin-top: 12px; }
  .pill { background: var(--slot); color: var(--ink); border-radius: 99px; text-align: center; font-weight: 800; font-size: 16px; padding: 8px 12px; display: flex; gap: 6px; align-items: center; justify-content: center; }
  .pill .input { text-align: center; font-weight: 800; background: rgba(255,255,255,.75); padding: 3px 8px; }
  .sess-list { display: grid; gap: 8px; margin-top: 10px; }
  .sess { position: relative; display: block; width: 100%; text-align: left; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; font-size: 15px; font-weight: 600; color: var(--ink); cursor: default; }
  .sess .meta { display: block; font-size: 12px; color: var(--muted); font-weight: 600; margin-top: 2px; }
  .sess.flag { border: 2px solid var(--warn); background: var(--warn-50); cursor: pointer; padding: 11px 13px; }
  .sess.flag:hover { box-shadow: 0 0 0 4px var(--warn-100); }
  .sess.flag.done { border-color: var(--ok); background: var(--ok-50); }
  .sess.flag.done:hover { box-shadow: 0 0 0 4px var(--ok-100); }
  .sess .badge { display: flex; margin-top: 8px; }
  .sess-edit { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 10px; display: grid; gap: 6px; }
  .sess-edit.flag { border: 2px solid var(--warn); background: var(--warn-50); }
  .sess-edit .row { flex-wrap: nowrap; gap: 2px; }
  .sess-edit .two { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .toggle { display: inline-flex; gap: 8px; align-items: center; font-size: 13px; font-weight: 700; color: var(--warn-600); cursor: pointer; user-select: none; }
  .toggle input { width: 16px; height: 16px; accent-color: var(--warn); }
  .empty-slot { color: var(--subtle); font-size: 13px; text-align: center; padding: 14px 6px; border: 1px dashed var(--line-2); border-radius: 14px; }
  .add-day { min-height: 120px; border: 2px dashed var(--line-2); border-radius: var(--r-lg); display: grid; place-items: center; background: transparent; cursor: pointer; color: var(--muted); font-weight: 700; font-size: 15px; }
  .add-day:hover { border-color: var(--brand); color: var(--brand); background: var(--brand-50); }

  /* checklist */
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .seg { display: inline-flex; gap: 2px; padding: 3px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; flex-wrap: wrap; }
  .seg button { height: 30px; padding: 0 12px; border: none; background: none; border-radius: 9px; font-weight: 700; font-size: 13px; color: var(--muted); cursor: pointer; }
  .seg button.on { background: var(--brand); color: #fff; }
  .cl-day { margin-bottom: 26px; }
  .cl-day-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
  .cl-day-head h2 { margin: 0; font-size: 22px; color: var(--ink); display: flex; gap: 10px; align-items: center; }
  .cl-day-head h2 .dotc { width: 14px; height: 14px; border-radius: 4px; background: var(--day); }
  .progress { flex: 1; min-width: 160px; max-width: 360px; height: 8px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
  .progress i { display: block; height: 100%; background: var(--ok); border-radius: 9px; transition: width .3s; }
  .block { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--sh-1); margin-bottom: 12px; overflow: hidden; scroll-margin-top: 80px; }
  .block.hl { animation: hl 1.6s ease; }
  @keyframes hl { 0%, 40% { box-shadow: 0 0 0 4px var(--warn); } }
  .block-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .block-head.pre { background: var(--brand-50); }
  .block-head.ev { background: var(--warn-50); }
  .block-head h3 { margin: 0; font-size: 16px; color: var(--ink); }
  .block-head .slot-tag { background: var(--slot); color: var(--ink); font-weight: 800; font-size: 12px; border-radius: 99px; padding: 3px 10px; }
  .tasks { list-style: none; margin: 0; padding: 0; }
  .task { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 11px 16px; border-bottom: 1px solid var(--surface-2); }
  .task:last-child { border-bottom: none; }
  .task input[type=checkbox] { width: 22px; height: 22px; margin: 1px 0 0; accent-color: var(--ok); cursor: pointer; }
  .task .txt { font-weight: 600; color: var(--ink); cursor: pointer; }
  .task .note { font-size: 13px; color: var(--muted); margin-top: 2px; white-space: pre-line; }
  .task .tags { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .task.done .txt { text-decoration: line-through; color: var(--muted); }
  .task.done { background: color-mix(in srgb, var(--ok-50) 60%, transparent); }
  .task-edit { display: grid; grid-template-columns: minmax(0, 2.2fr) minmax(0, 1fr) minmax(0, 1fr) auto; gap: 6px; padding: 10px 16px; border-bottom: 1px solid var(--surface-2); align-items: start; }
  .task-edit .note-in { grid-column: 1 / 4; }
  .task-edit .acts { display: flex; gap: 4px; grid-row: 1 / 3; grid-column: 4; }
  .block-foot { padding: 10px 16px; }
  .empty { padding: 14px 16px; color: var(--subtle); font-size: 14px; }
  .none-left { background: var(--ok-50); border: 1px solid var(--ok-100); color: var(--ok-600); border-radius: var(--r); padding: 14px 16px; font-weight: 700; margin-bottom: 12px; }
  .hint { color: var(--muted); font-size: 13px; margin: 6px 0 0; }

  /* toasts + dialogs */
  .toasts { position: fixed; z-index: 1000; right: 16px; top: 72px; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: none; max-width: calc(100vw - 32px); }
  .toast { pointer-events: auto; display: flex; gap: 10px; align-items: flex-start; background: var(--ink); color: #fff; padding: 12px 14px; border-radius: var(--r-sm); box-shadow: var(--sh-3); font-size: 14px; max-width: 420px; animation: toastIn .3s var(--spring); }
  .toast.ok .i { color: #4ade80; } .toast.err { background: #881337; } .toast.err .i { color: #fda4af; }
  @keyframes toastIn { from { transform: translateY(12px) scale(.96); opacity: 0; } }
  dialog.confirm { border: none; border-radius: var(--r-lg); padding: 0; width: min(420px, calc(100vw - 32px)); box-shadow: var(--sh-3); }
  dialog.confirm::backdrop { background: rgba(15,23,42,.45); backdrop-filter: blur(2px); }
  .confirm-body { padding: 22px 22px 8px; }
  .confirm-body h3 { margin: 0 0 6px; font-size: 18px; color: var(--ink); }
  .confirm-body p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
  .confirm-body .input { margin-top: 10px; }
  .confirm-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 16px 22px 20px; }
  .loading { text-align: center; padding: 80px 20px; color: var(--muted); font-weight: 600; }

  @media (max-width: 720px) {
    .hd { padding: 10px 16px; flex-wrap: wrap; }
    .hd .title-txt, .hd a.btn.ghost { display: none; }
    main { padding: 16px 16px 60px; }
    .hero { grid-template-columns: 1fr; padding: 20px; }
    .hero h1 { font-size: 23px; }
    .slots { grid-template-columns: 1fr; }
    .task { grid-template-columns: 28px minmax(0, 1fr); }
    .task .tags { grid-column: 2; justify-content: flex-start; }
    .task-edit { grid-template-columns: 1fr 1fr; }
    .task-edit .txt-in { grid-column: 1 / 3; }
    .task-edit .note-in { grid-column: 1 / 3; }
    .task-edit .acts { grid-row: auto; grid-column: 1 / 3; justify-content: flex-end; }
  }
  @media print {
    header, .toolbar, .editbar, .btn, .add-day { display: none !important; }
    body { background: #fff; }
    .hero { background: none; color: var(--ink); box-shadow: none; padding: 0; }
    .stat { background: none; border: 1px solid var(--line); }
    .block, .day { box-shadow: none; break-inside: avoid; }
  }
</style>
</head>

<header><div class="hd">
  <a class="logo" href="index.html" title="Induction Hub" style="text-decoration:none">🧰</a>

<script type="module">
/* =====================================================================
   1. CONFIG — same Firebase project as healthcare.html (see FIREBASE_SETUP.md)
      Data lives in one Firestore document: su_setup/main
   ===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyARCoY6TQUKDghViUafeNMpxIPD_ZyzekA",
  authDomain: "induction-5725a.firebaseapp.com",
  projectId: "induction-5725a",
  storageBucket: "induction-5725a.firebasestorage.app",
  messagingSenderId: "538687322070",
  appId: "1:538687322070:web:f64d09f0c8f8903b29d677"
};
/* Optional PIN asked before Edit mode (once per tab). "" = no PIN. Not real security. */
const EDIT_PIN = "";
const FIREBASE_VERSION = "10.12.2";
const USE_FIREBASE = !!firebaseConfig.apiKey && !firebaseConfig.apiKey.startsWith("PASTE");
const PATH = "su_setup/main";
const DAY_COLORS = ["#8496a9", "#223f6e", "#1b6082", "#15803d", "#7c3aed", "#b45309"];

/* =====================================================================
   2. DATA LAYER (Firestore, or this browser only in demo mode)
   ===================================================================== */
async function makeFirebaseStore() {
  const base = `https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/`;
  const [{ initializeApp }, fs] = await Promise.all([import(base + "firebase-app.js"), import(base + "firebase-firestore.js")]);
  const db = fs.getFirestore(initializeApp(firebaseConfig));
  const ref = p => fs.doc(db, p);
  return {
    mode: "firebase",
    watchDoc: (p, cb, err) => fs.onSnapshot(ref(p), s => cb(s.exists() ? s.data() : null), err),
    tx: (p, fn) => fs.runTransaction(db, async t => {
      const r = ref(p); const s = await t.get(r);
      const out = fn(s.exists() ? s.data() : null);
      if (out.write) t.set(r, out.write);
    }),
  };
}
function makeLocalStore() {
  const P = "susetup:";
  const subs = new Set();
  const get = p => { try { const v = localStorage.getItem(P + p); return v ? JSON.parse(v) : null; } catch { return null; } };
  const ping = () => queueMicrotask(() => subs.forEach(f => f()));
  window.addEventListener("storage", e => { if (!e.key || e.key.startsWith(P)) ping(); });
  return {
    mode: "local",
    watchDoc: (p, cb) => { const f = () => cb(get(p)); subs.add(f); queueMicrotask(f); return () => subs.delete(f); },
    tx: async (p, fn) => { const out = fn(get(p)); if (out.write) { try { localStorage.setItem(P + p, JSON.stringify(out.write)); } catch {} ping(); } },
  };
}

/* =====================================================================
   3. HELPERS
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);

function ask(title, body, { ok = "Confirm", danger = false, input = null } = {}) {

      <div class="confirm-foot"><button class="btn" value="no" formnovalidate>Cancel</button><button class="btn ${danger ? "danger-solid" : "primary"}" value="yes">${esc(ok)}</button></div></form>`;
    document.body.appendChild(d);
    d.addEventListener("click", e => { if (e.target === d) d.close("no"); });
    d.addEventListener("close", () => { const v = d.querySelector("input")?.value; res(d.returnValue === "yes" ? (input !== null ? v : true) : false); d.remove(); });
    d.showModal();

}

/* =====================================================================
   5. STATE
   ===================================================================== */
let DB, unsub, state = null, seeded = false, localReason = "";
const ui = {
  tab: (() => { try { return localStorage.getItem("susetup:tab") || "agenda"; } catch { return "agenda"; } })(),
  edit: false, filter: "all", owner: "",
};
let unlocked = !EDIT_PIN;
try { if (EDIT_PIN && sessionStorage.getItem("susetup:pin") === EDIT_PIN) unlocked = true; } catch {}

const findDay = (s, d) => s.days.find(x => x.id === d);
const findSlot = (s, d, sl) => findDay(s, d)?.slots.find(x => x.id === sl);
const findSess = (s, d, sl, x) => findSlot(s, d, sl)?.sessions.find(y => y.id === x);
const taskList = (s, a) => a.x ? findSess(s, a.d, a.s, a.x)?.tasks : findDay(s, a.d)?.pre;
const move = (arr, i, dir) => { const j = i + dir; if (j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; };

function dayTasks(day) {
  const out = [...day.pre];
  day.slots.forEach(sl => sl.sessions.forEach(x => { if (x.setup) out.push(...x.tasks); }));
  return out;
}
const count = ts => ({ done: ts.filter(t => t.done).length, total: ts.length });

/* Apply a change locally at once, then commit it to the shared store in a transaction. */
function mutate(fn, { defer = false } = {}) {
  if (!state) return;
  fn(state);
  if (defer) render.pending = true; else render();
  DB.tx(PATH, cur => { const s = cur ? clone(cur) : clone(state); fn(s); s.updatedAt = Date.now(); return { write: s }; })
    .catch(showError);
}
function showError(e) {
  console.error(e);
  const msg = String(e?.message || e);
  toast(/permission|insufficient/i.test(msg)
    ? "Permission denied by Firestore. Publish the rules in firestore.rules (they now include su_setup)."
    : "Couldn't save: " + msg, "err", 6000);
}

   ===================================================================== */
const ownerChip = t => t.owner ? `<span class="chip brand">${icon("user")}${esc(t.owner)}</span>` : "";
const whenChip = t => t.when ? `<span class="chip">${icon("clock")}${esc(t.when)}</span>` : "";
const progChip = c => c.total ? `<span class="chip ${c.done === c.total ? "ok" : "warn"}">${c.done === c.total ? icon("check") : icon("flag")}Setup ${c.done}/${c.total}</span>` : `<span class="chip warn">${icon("flag")}Setup · no tasks yet</span>`;
const A = o => Object.entries(o).filter(([, v]) => v != null).map(([k, v]) => `data-${k}="${esc(v)}"`).join(" ");

function render(force = false) {
  // Don't redraw under someone typing; redraw once they leave the field.
  if (!force && fieldBusy) { render.pending = true; return; }
  render.pending = false;
  if (!state) return;
  document.title = state.title || "Induction Setup Checklist";
  $("#conn").className = "conn" + (DB.mode === "local" ? " local" : "");
  $("#conn").innerHTML = `<span class="dot"></span>${DB.mode === "local" ? (localReason || "Demo mode (this browser only)") : "Live · shared with the team"}`;
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.v === ui.tab));
  const eb = $("#editBtn");
  eb.className = "btn" + (ui.edit ? " editing" : "");
  eb.innerHTML = ui.edit ? `${icon("check")}Done editing` : `${icon("edit")}Edit`;
  $('[data-act="menu"]').innerHTML = icon("dots");

  const all = state.days.flatMap(dayTasks), c = count(all);
  const pct = n => n.total ? Math.round(n.done / n.total * 100) : 0;
  const hero = `<section class="hero">
    <div>${ui.edit ? `<div class="edit-stack">
        <input class="input big on-dark" data-edit="meta" data-f="title" value="${esc(state.title)}" placeholder="Title">
        <input class="input on-dark" data-edit="meta" data-f="subtitle" value="${esc(state.subtitle)}" placeholder="Subtitle">
      </div>` : `<h1>${esc(state.title)}</h1><p>${esc(state.subtitle)}</p>`}</div>
    <div class="stats">
      <div class="stat"><small>All setup</small><b>${c.done}/${c.total}</b><div class="bar"><i style="width:${pct(c)}%"></i></div></div>
      ${state.days.map(d => { const k = count(dayTasks(d)); return `<div class="stat"><small>${esc(d.name)}</small><b>${k.done}/${k.total}</b><div class="bar"><i style="width:${pct(k)}%"></i></div></div>`; }).join("")}
    </div></section>`;
  const editbar = ui.edit ? `<div class="editbar">${icon("edit")}<span>Edit mode: changes save automatically and everyone sees them straight away.</span></div>` : "";
  $("#app").innerHTML = editbar + hero + (ui.tab === "agenda" ? renderAgenda() : renderChecklist());
  if (render.focusKey) {
    const el = document.querySelector(`[data-key="${render.focusKey}"]`);
    render.focusKey = null;
    if (el) { el.focus(); if (el.select) el.select(); }
  }
}

function renderChecklist() {
  const owners = [...new Set(state.days.flatMap(dayTasks).map(t => t.owner.trim()).filter(Boolean))].sort();
  if (ui.owner && !owners.includes(ui.owner)) ui.owner = "";
  const toolbar = ui.edit ? `<p class="hint" style="margin:0 0 14px">Add, edit, reorder and delete tasks below. To give an agenda item its own checklist, tick <b>Needs setup</b> on it in the Agenda tab.</p>`
    : `<div class="toolbar">
      <div class="seg"><button data-act="filter" data-v="all" class="${ui.filter === "all" ? "on" : ""}">All tasks</button><button data-act="filter" data-v="todo" class="${ui.filter === "todo" ? "on" : ""}">Still to do</button></div>
      ${owners.length ? `<div class="seg"><button data-act="owner" data-v="" class="${!ui.owner ? "on" : ""}">Everyone</button>${owners.map(o => `<button data-act="owner" data-v="${esc(o)}" class="${ui.owner === o ? "on" : ""}">${esc(o)}</button>`).join("")}</div>` : ""}
    </div>`;
  const visible = t => (ui.filter === "all" || !t.done) && (!ui.owner || t.owner.trim() === ui.owner);
  const days = state.days.map(d => {
    const k = count(dayTasks(d));
    const blocks = [block(d, null, null, d.pre, visible)];
    d.slots.forEach(sl => sl.sessions.forEach(x => { if (x.setup) blocks.push(block(d, sl, x, x.tasks, visible)); }));
    const shown = blocks.filter(Boolean);
    return `<section class="cl-day" style="--day:${esc(d.color)}">
      <div class="cl-day-head"><h2><span class="dotc"></span>${esc(d.name)}${d.date ? ` <span class="muted" style="font-size:15px;font-weight:600">${esc(d.date)}</span>` : ""}</h2>
        <div class="progress"><i style="width:${k.total ? k.done / k.total * 100 : 0}%"></i></div><span class="chip ${k.total && k.done === k.total ? "ok" : ""}">${k.done}/${k.total} done</span></div>
      ${shown.join("") || `<div class="none-left">✓ Nothing left here${ui.owner ? ` for ${esc(ui.owner)}` : ""}.</div>`}</section>`;
  }).join("");
  const dl = ui.edit ? `<datalist id="owners">${owners.map(o => `<option value="${esc(o)}">`).join("")}</datalist>` : "";

function block(d, sl, x, tasks, visible) {

    ? `<div class="block-head ev"><span class="slot-tag">${esc(sl.label)}</span><h3>${esc(x.title)}</h3>${x.time || x.venue ? `<span class="muted" style="font-size:13px;font-weight:600">${[x.time, x.venue].filter(Boolean).map(esc).join(" · ")}</span>` : ""}<div class="spacer"></div>${progChip(c)}</div>`
    : `<div class="block-head pre">${icon("flag")}<h3>Before ${esc(d.name)} · general setup</h3><div class="spacer"></div><span class="chip ${c.total && c.done === c.total ? "ok" : "brand"}">${c.done}/${c.total}</span></div>`;
  const rows = list.map((t, i) => ui.edit ? taskEdit(ids, t, i, tasks.length) : taskRow(ids, t)).join("")

function taskEdit(ids, t, i, n) {

   ===================================================================== */
const ds = el => ({ d: el.dataset.d, s: el.dataset.s, x: el.dataset.x, t: el.dataset.t, v: el.dataset.v });

document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]");
  if (!$("#menu").hidden && !e.target.closest(".menu")) $("#menu").hidden = true;
  if (!el || el.disabled) return;
  const act = el.dataset.act, a = ds(el);
  if (act === "tick" || act === "sess-setup") return; // handled on change
  switch (act) {
    case "tab": ui.tab = a.v; try { localStorage.setItem("susetup:tab", a.v); } catch {} render(); window.scrollTo(0, 0); break;
    case "menu": $("#menu").hidden = !$("#menu").hidden; break;
    case "edit":
      if (!ui.edit && !unlocked) {
        const pin = await ask("Enter edit PIN", "Editing is locked with a PIN.", { ok: "Unlock", input: "" });
        if (pin === false) return;
        if (pin !== EDIT_PIN) return toast("Wrong PIN.", "err");
        unlocked = true; try { sessionStorage.setItem("susetup:pin", EDIT_PIN); } catch {}
      }
      ui.edit = !ui.edit; render(); break;
    case "filter": ui.filter = a.v; render(); break;
    case "owner": ui.owner = a.v; render(); break;
    case "goto": {
      ui.tab = "checklist"; ui.filter = "all"; ui.owner = ""; render();
      const b = document.getElementById(el.dataset.k);
      if (b) { b.scrollIntoView({ behavior: "smooth", block: "start" }); b.classList.remove("hl"); void b.offsetWidth; b.classList.add("hl"); }
      break;
    }
    case "day-add": {
      const id = uid(), n = state.days.length + 1;
      mutate(s => s.days.push({ id, name: `Day ${n}`, date: "", color: DAY_COLORS[(n - 1) % DAY_COLORS.length], pre: [],
        slots: [{ id: id + "a", label: "AM", sessions: [] }, { id: id + "p", label: "PM", sessions: [] }] }));
      break;
    }
    case "day-del": {
      const d = findDay(state, a.d);
      if (!await ask(`Delete ${d.name}?`, "This removes the day, its agenda items and all its setup tasks.", { ok: "Delete", danger: true })) return;
      mutate(s => { s.days = s.days.filter(x => x.id !== a.d); }); break;
    }
    case "day-move": mutate(s => move(s.days, s.days.findIndex(x => x.id === a.d), +a.v)); break;
    case "day-color": mutate(s => { const d = findDay(s, a.d); if (d) d.color = a.v; }); break;
    case "slot-add": { const id = uid(); mutate(s => findDay(s, a.d)?.slots.push({ id, label: "PM", sessions: [] })); break; }
    case "slot-move": mutate(s => { const d = findDay(s, a.d); if (d) move(d.slots, d.slots.findIndex(x => x.id === a.s), +a.v); }); break;
    case "slot-del": {
      const sl = findSlot(state, a.d, a.s);
      if (sl.sessions.length && !await ask(`Delete the ${sl.label} block?`, `It has ${sl.sessions.length} agenda item(s), which will be deleted too.`, { ok: "Delete", danger: true })) return;
      mutate(s => { const d = findDay(s, a.d); if (d) d.slots = d.slots.filter(x => x.id !== a.s); }); break;
    }
    case "sess-add": { const id = uid(); render.focusKey = "t-" + id; mutate(s => findSlot(s, a.d, a.s)?.sessions.push({ id, title: "", time: "", venue: "", setup: false, tasks: [] })); break; }
    case "sess-move": mutate(s => { const sl = findSlot(s, a.d, a.s); if (sl) move(sl.sessions, sl.sessions.findIndex(x => x.id === a.x), +a.v); }); break;
    case "sess-del": {
      const x = findSess(state, a.d, a.s, a.x);
      if ((x.tasks.length || x.title) && !await ask(`Delete "${x.title || "this item"}"?`, x.tasks.length ? `Its ${x.tasks.length} setup task(s) will be deleted too.` : "It will be removed from the agenda.", { ok: "Delete", danger: true })) return;
      mutate(s => { const sl = findSlot(s, a.d, a.s); if (sl) sl.sessions = sl.sessions.filter(y => y.id !== a.x); }); break;
    }
    case "task-add": { const id = uid(); render.focusKey = "k-" + id; mutate(s => taskList(s, a)?.push({ id, text: "", owner: "", when: "", note: "", done: false })); break; }
    case "task-move": mutate(s => { const l = taskList(s, a); if (l) move(l, l.findIndex(t => t.id === a.t), +a.v); }); break;
    case "task-del": mutate(s => { const l = taskList(s, a); const i = l ? l.findIndex(t => t.id === a.t) : -1; if (i >= 0) l.splice(i, 1); }); break;
    case "untick":
      $("#menu").hidden = true;
      if (!await ask("Untick everything?", "Clears every tick on every day so the checklist is ready for the next intake. Tasks and the agenda stay as they are.", { ok: "Untick all" })) return;
      mutate(s => s.days.forEach(d => { d.pre.forEach(t => t.done = false); d.slots.forEach(sl => sl.sessions.forEach(x => x.tasks.forEach(t => t.done = false))); }));
      toast("All ticks cleared."); break;
    case "guide": location.href = "setup-guide.html"; break;
    case "print": $("#menu").hidden = true; ui.tab = "checklist"; ui.edit = false; ui.filter = "all"; ui.owner = ""; render(); setTimeout(() => print(), 50); break;
    case "export": {
      $("#menu").hidden = true;
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `induction-setup-${new Date().toISOString().slice(0, 10)}.json`;
      link.click(); setTimeout(() => URL.revokeObjectURL(link.href), 1000); break;
    }
    case "import": $("#menu").hidden = true; $("#importFile").click(); break;
    case "sample":
      $("#menu").hidden = true;
      if (!await ask("Replace with the sample agenda?", "This overwrites the current agenda and checklist for everyone. Export a backup first if you might need it.", { ok: "Replace", danger: true })) return;
      { const fresh = sample(); mutate(s => { Object.keys(s).forEach(k => delete s[k]); Object.assign(s, clone(fresh)); }); }
      break;
  }
});

document.addEventListener("change", e => {
  const el = e.target, a = ds(el);
  if (el.dataset.act === "tick") {
    mutate(s => { const t = taskList(s, a)?.find(t => t.id === a.t); if (t) t.done = el.checked; });
  } else if (el.dataset.act === "sess-setup") {
    mutate(s => { const x = findSess(s, a.d, a.s, a.x); if (x) x.setup = el.checked; });
  } else if (el.dataset.edit) {
    const f = el.dataset.f, v = el.value.trim();
    mutate(s => {
      const target = { meta: () => s, day: () => findDay(s, a.d), slot: () => findSlot(s, a.d, a.s),
        sess: () => findSess(s, a.d, a.s, a.x), task: () => taskList(s, a)?.find(t => t.id === a.t) }[el.dataset.edit]?.();
      if (target) target[f] = v;
    }, { defer: true }); // redrawn on focusout, once focus has landed on the next field
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.matches?.("input.input")) e.target.blur();
});
// After leaving a field, redraw if anything changed meanwhile, keeping focus on wherever the user went next.
// fieldBusy stays true from focusing a field until focus has settled somewhere else (a redraw
// in between, e.g. from a live update, would otherwise throw away the field the user tabbed to).
let fieldBusy = false;
document.addEventListener("focusin", e => { if (e.target.matches?.("#app input.input")) fieldBusy = true; });
document.addEventListener("focusout", () => setTimeout(() => {
  const ae = document.activeElement;
  fieldBusy = !!ae?.matches?.("#app input.input");
  if (!render.pending) return;
  const key = fieldBusy ? keyOf(ae) : null;
  render(true);
  if (key) document.querySelector(key)?.focus();
}, 0));
const keyOf = el => "#app " + ["edit", "f", "d", "s", "x", "t"].filter(k => el.dataset[k]).map(k => `[data-${k}="${CSS.escape(el.dataset[k])}"]`).join("");

$("#importFile").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = "";
  if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!Array.isArray(data.days)) throw new Error("This file isn't a setup checklist export.");
    if (!await ask("Import this file?", `Replaces the current agenda and checklist for everyone with "${data.title || f.name}".`, { ok: "Import", danger: true })) return;
    mutate(s => { Object.keys(s).forEach(k => delete s[k]); Object.assign(s, clone(data)); });
    toast("Imported.");
  } catch (err) { toast(String(err.message || err), "err"); }
});

/* =====================================================================
   8. START
   ===================================================================== */
function onData(d) {
  if (!d) {
    if (!seeded) { seeded = true; DB.tx(PATH, cur => cur ? {} : { write: sample() }).catch(onErr); }
    return;
  }
  state = d; render();
}
function onErr(e) {
  console.error(e);
  if (DB.mode === "firebase") {
    localReason = /permission|insufficient/i.test(String(e?.message || e))
      ? "Demo mode: Firestore rules not published yet" : "Demo mode: couldn't reach Firebase";
    toast(localReason + ". Changes are saved in this browser only.", "err", 7000);
    unsub?.(); DB = makeLocalStore(); seeded = false; unsub = DB.watchDoc(PATH, onData, onErr);
  } else showError(e);
}
(async () => {
  try { DB = USE_FIREBASE ? await makeFirebaseStore() : makeLocalStore(); }
  catch (e) { console.error(e); DB = makeLocalStore(); localReason = "Demo mode: couldn't load Firebase"; }
  unsub = DB.watchDoc(PATH, onData, onErr);
})();
</script>
</body>
