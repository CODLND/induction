<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b6082">
<title>Induction Setup Checklist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Same design tokens as healthcare.html / guide.html */
  :root {
    --brand: #1b6082; --brand-600: #164f6b; --brand-700: #0f3a50; --brand-50: #eef6fa; --brand-100: #d6eaf3; --brand-200: #a9d2e4;
    --ink: #0f172a; --text: #1e293b; --muted: #64748b; --subtle: #94a3b8;
    --line: #cfdbe0; --line-2: #b8c7ce;
    --bg: #dde7eb; --surface: #f6f9fa; --surface-2: #ecf2f4;
    --ok: #16a34a; --ok-600: #15803d; --ok-50: #ecfdf3; --ok-100: #d1fadf;
    --warn: #d97706; --warn-600: #b45309; --warn-50: #fffbeb; --warn-100: #fef3c7;
    --bad: #e11d48; --bad-50: #fff1f2;
    --slot: #f6a531;
    --r-sm: 12px; --r: 16px; --r-lg: 22px;
    --sh-1: 0 1px 2px rgba(15,23,42,.05), 0 1px 3px rgba(15,23,42,.06);
    --sh-2: 0 2px 6px rgba(15,23,42,.05), 0 10px 30px rgba(15,23,42,.08);
    --sh-3: 0 10px 40px rgba(15,23,42,.18);
    --font: "Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
    --spring: cubic-bezier(.3, 1.4, .5, 1);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); -webkit-font-smoothing: antialiased; line-height: 1.45; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--brand); }
  [hidden] { display: none !important; }
  svg.i { width: 1.1em; height: 1.1em; flex: 0 0 auto; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  :focus-visible { outline: 3px solid color-mix(in srgb, var(--brand) 45%, transparent); outline-offset: 2px; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 38px; padding: 0 14px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--surface); color: var(--text); font-weight: 600; font-size: 14px; cursor: pointer; text-decoration: none; white-space: nowrap; box-shadow: var(--sh-1); transition: background .15s, border-color .15s, transform .1s; }
  .btn:hover { border-color: var(--line-2); background: var(--surface-2); }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  .btn.primary:hover { background: var(--brand-600); }
  .btn.ghost { background: transparent; border-color: transparent; box-shadow: none; }
  .btn.ghost:hover { background: rgba(15,23,42,.05); }
  .btn.danger { color: var(--bad); }
  .btn.danger:hover { background: var(--bad-50); border-color: #fecdd3; }
  .btn.danger-solid { background: var(--bad); border-color: var(--bad); color: #fff; }
  .btn.sm { height: 30px; padding: 0 10px; font-size: 13px; border-radius: 10px; }
  .btn.icon { width: 38px; padding: 0; } .btn.sm.icon { width: 30px; }
  .btn.dashed { border-style: dashed; background: transparent; box-shadow: none; color: var(--muted); }
  .btn.dashed:hover { color: var(--brand); border-color: var(--brand-200); background: var(--brand-50); }
  .chip { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; }
  .chip.brand { background: var(--brand-50); border-color: var(--brand-100); color: var(--brand-700); }
  .chip.ok { background: var(--ok-50); border-color: var(--ok-100); color: var(--ok-600); }
  .chip.warn { background: var(--warn-50); border-color: var(--warn-100); color: var(--warn-600); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .spacer { flex: 1; }
  .muted { color: var(--muted); }
  .input { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; background: #fff; font-size: 14px; font-weight: 500; color: var(--ink); transition: border-color .15s, box-shadow .15s; min-width: 0; }
  .input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-100); }
  .input.big { font-size: 22px; font-weight: 800; padding: 6px 10px; }
  .input.on-dark { background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.3); color: #fff; }
  .input.on-dark::placeholder { color: rgba(255,255,255,.65); }

  /* header */
  header { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--surface) 85%, transparent); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
  .hd { max-width: 1240px; margin: 0 auto; padding: 10px 20px; display: flex; align-items: center; gap: 12px; }
  .logo { width: 34px; height: 34px; border-radius: 10px; background: var(--brand); display: grid; place-items: center; font-size: 18px; flex: 0 0 auto; }
  .hd b { color: var(--ink); font-size: 16px; }
  .conn { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .conn .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px var(--ok-100); }
  .conn.local .dot { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-100); }
  .tabs { display: inline-flex; gap: 2px; padding: 3px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; }
  .tabs button { height: 32px; padding: 0 14px; border: none; background: none; border-radius: 9px; font-weight: 700; font-size: 14px; color: var(--muted); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
  .tabs button.on { background: var(--surface); color: var(--ink); box-shadow: var(--sh-1); }
  .btn.editing { background: var(--warn); border-color: var(--warn); color: #fff; }
  .menu { position: relative; }
  .menu-pop { position: absolute; right: 0; top: 44px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); box-shadow: var(--sh-3); padding: 6px; min-width: 280px; z-index: 30; }
  .menu-pop button { white-space: nowrap; }
  .menu-pop button { display: flex; width: 100%; gap: 10px; align-items: center; padding: 9px 10px; border: none; background: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; text-align: left; }
  .menu-pop button:hover { background: var(--surface-2); }
  .menu-pop hr { border: none; border-top: 1px solid var(--line); margin: 4px 0; }

  main { max-width: 1240px; margin: 0 auto; padding: 22px 20px 80px; }
  .editbar { background: var(--warn-50); border: 1px solid var(--warn-100); color: var(--warn-600); border-radius: var(--r-sm); padding: 10px 14px; font-size: 14px; font-weight: 600; margin-bottom: 16px; display: flex; gap: 10px; align-items: center; }

  /* hero */
  .hero { background: linear-gradient(135deg, var(--brand) 0%, #2a7aa1 100%); color: #fff; border-radius: var(--r-lg); padding: 24px 28px; box-shadow: var(--sh-2); margin-bottom: 20px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 20px; align-items: center; }
  .hero h1 { margin: 0 0 4px; font-size: 28px; letter-spacing: -.02em; line-height: 1.15; }
  .hero p { margin: 0; opacity: .92; font-size: 15px; }
  .hero .edit-stack { display: grid; gap: 8px; max-width: 640px; }
  .stats { display: flex; gap: 10px; flex-wrap: wrap; }
  .stat { background: rgba(255,255,255,.14); border-radius: 14px; padding: 10px 14px; min-width: 130px; }
  .stat small { display: block; font-size: 12px; opacity: .85; font-weight: 600; }
  .stat b { font-size: 22px; }
  .stat .bar { height: 6px; background: rgba(255,255,255,.25); border-radius: 9px; overflow: hidden; margin-top: 6px; }
  .stat .bar i { display: block; height: 100%; background: #fff; border-radius: 9px; }

  /* agenda */
  .legend { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--muted); margin: 0 0 12px; }
  .legend .sw { display: inline-block; width: 14px; height: 14px; border-radius: 4px; vertical-align: -2px; margin-right: 5px; }
  .agenda { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 520px), 1fr)); gap: 18px; align-items: start; }
  .day { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px; box-shadow: var(--sh-2); }
  .day-head { background: var(--day); color: #fff; border-radius: 14px; padding: 14px 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .day-head h2 { margin: 0; font-size: 22px; font-style: italic; font-weight: 700; }
  .day-head .date { opacity: .9; font-size: 14px; font-weight: 600; }
  .day-head .pre { margin-left: auto; background: rgba(255,255,255,.18); border: none; color: #fff; border-radius: 99px; padding: 5px 11px; font-size: 12px; font-weight: 700; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
  .day-head .pre:hover { background: rgba(255,255,255,.28); }
  .day-edit { display: grid; gap: 8px; width: 100%; }
  .swatches { display: flex; gap: 6px; align-items: center; }
  .swatches button { width: 22px; height: 22px; border-radius: 50%; border: 2px solid rgba(255,255,255,.6); cursor: pointer; padding: 0; }
  .swatches button.on { border-color: #fff; box-shadow: 0 0 0 2px rgba(0,0,0,.35); }
  .slots { display: grid; grid-template-columns: repeat(var(--n, 2), minmax(0, 1fr)); gap: 12px; margin-top: 12px; }
  .pill { background: var(--slot); color: var(--ink); border-radius: 99px; text-align: center; font-weight: 800; font-size: 16px; padding: 8px 12px; display: flex; gap: 6px; align-items: center; justify-content: center; }
  .pill .input { text-align: center; font-weight: 800; background: rgba(255,255,255,.75); padding: 3px 8px; }
  .sess-list { display: grid; gap: 8px; margin-top: 10px; }
  .sess { position: relative; display: block; width: 100%; text-align: left; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; font-size: 15px; font-weight: 600; color: var(--ink); cursor: default; }
  .sess .meta { display: block; font-size: 12px; color: var(--muted); font-weight: 600; margin-top: 2px; }
  .sess.flag { border: 2px solid var(--warn); background: var(--warn-50); cursor: pointer; padding: 11px 13px; }
  .sess.flag:hover { box-shadow: 0 0 0 4px var(--warn-100); }
  .sess.flag.done { border-color: var(--ok); background: var(--ok-50); }
  .sess.flag.done:hover { box-shadow: 0 0 0 4px var(--ok-100); }
  .sess .badge { display: flex; margin-top: 8px; }
  .pre-box { background: var(--brand-50); border: 1px solid var(--brand-100); border-radius: 14px; padding: 8px 12px 8px; margin-top: 12px; }
  .pre-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 14px; font-weight: 800; color: var(--ink); }
  .pre-head .btn { height: 28px; color: var(--brand); }
  .pre-box .mini label:hover { background: rgba(255,255,255,.8); }
  .mini { list-style: none; margin: 8px -6px 0; padding: 0; display: grid; gap: 1px; }
  .mini label { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; font-weight: 600; color: var(--text); padding: 4px 6px; border-radius: 8px; cursor: pointer; }
  .mini label:hover { background: rgba(255,255,255,.75); }
  .mini input { width: 16px; height: 16px; margin: 1px 0 0; accent-color: var(--ok); flex: 0 0 auto; cursor: pointer; }
  .mini small.mnote { font-style: italic; white-space: pre-line; }
  .mini small { display: block; font-size: 12px; font-weight: 500; color: var(--muted); }
  .mini .done .mt { text-decoration: line-through; color: var(--muted); }
  .sess-edit { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 10px; display: grid; gap: 6px; }
  .sess-edit.flag { border: 2px solid var(--warn); background: var(--warn-50); }
  .sess-edit .row { flex-wrap: nowrap; gap: 2px; }
  .sess-edit .two { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .toggle { display: inline-flex; gap: 8px; align-items: center; font-size: 13px; font-weight: 700; color: var(--warn-600); cursor: pointer; user-select: none; }
  .toggle input { width: 16px; height: 16px; accent-color: var(--warn); }
  .empty-slot { color: var(--subtle); font-size: 13px; text-align: center; padding: 14px 6px; border: 1px dashed var(--line-2); border-radius: 14px; }
  .add-day { min-height: 120px; border: 2px dashed var(--line-2); border-radius: var(--r-lg); display: grid; place-items: center; background: transparent; cursor: pointer; color: var(--muted); font-weight: 700; font-size: 15px; }
  .add-day:hover { border-color: var(--brand); color: var(--brand); background: var(--brand-50); }

  /* checklist */
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .seg { display: inline-flex; gap: 2px; padding: 3px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; flex-wrap: wrap; }
  .seg button { height: 30px; padding: 0 12px; border: none; background: none; border-radius: 9px; font-weight: 700; font-size: 13px; color: var(--muted); cursor: pointer; }
  .seg button.on { background: var(--brand); color: #fff; }
  .cl-day { margin-bottom: 26px; }
  .cl-day-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
  .cl-day-head h2 { margin: 0; font-size: 22px; color: var(--ink); display: flex; gap: 10px; align-items: center; }
  .cl-day-head h2 .dotc { width: 14px; height: 14px; border-radius: 4px; background: var(--day); }
  .progress { flex: 1; min-width: 160px; max-width: 360px; height: 8px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
  .progress i { display: block; height: 100%; background: var(--ok); border-radius: 9px; transition: width .3s; }
  .block { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--sh-1); margin-bottom: 12px; overflow: hidden; scroll-margin-top: 80px; }
  .block.hl { animation: hl 1.6s ease; }
  @keyframes hl { 0%, 40% { box-shadow: 0 0 0 4px var(--warn); } }
  .block-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .block-head.pre { background: var(--brand-50); }
  .block-head.ev { background: var(--warn-50); }
  .block-head h3 { margin: 0; font-size: 16px; color: var(--ink); }
  .block-head .slot-tag { background: var(--slot); color: var(--ink); font-weight: 800; font-size: 12px; border-radius: 99px; padding: 3px 10px; }
  .tasks { list-style: none; margin: 0; padding: 0; }
  .task { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 11px 16px; border-bottom: 1px solid var(--surface-2); }
  .task:last-child { border-bottom: none; }
  .task input[type=checkbox] { width: 22px; height: 22px; margin: 1px 0 0; accent-color: var(--ok); cursor: pointer; }
  .task .txt { font-weight: 600; color: var(--ink); cursor: pointer; }
  .task .note { font-size: 13px; color: var(--muted); margin-top: 2px; white-space: pre-line; }
  .task .tags { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .task.done .txt { text-decoration: line-through; color: var(--muted); }
  .task.done { background: color-mix(in srgb, var(--ok-50) 60%, transparent); }
  .task-edit { display: grid; grid-template-columns: minmax(0, 2.2fr) minmax(0, 1fr) minmax(0, 1fr) auto; gap: 6px; padding: 10px 16px; border-bottom: 1px solid var(--surface-2); align-items: start; }
  .task-edit .note-in { grid-column: 1 / 4; }
  .task-edit .acts { display: flex; gap: 4px; grid-row: 1 / 3; grid-column: 4; }
  .block-foot { padding: 10px 16px; }
  .empty { padding: 14px 16px; color: var(--subtle); font-size: 14px; }
  .none-left { background: var(--ok-50); border: 1px solid var(--ok-100); color: var(--ok-600); border-radius: var(--r); padding: 14px 16px; font-weight: 700; margin-bottom: 12px; }
  .hint { color: var(--muted); font-size: 13px; margin: 6px 0 0; }

  /* toasts + dialogs */
  .toasts { position: fixed; z-index: 1000; right: 16px; top: 72px; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: none; max-width: calc(100vw - 32px); }
  .toast { pointer-events: auto; display: flex; gap: 10px; align-items: flex-start; background: var(--ink); color: #fff; padding: 12px 14px; border-radius: var(--r-sm); box-shadow: var(--sh-3); font-size: 14px; max-width: 420px; animation: toastIn .3s var(--spring); }
  .toast.ok .i { color: #4ade80; } .toast.err { background: #881337; } .toast.err .i { color: #fda4af; }
  @keyframes toastIn { from { transform: translateY(12px) scale(.96); opacity: 0; } }
  dialog.confirm { border: none; border-radius: var(--r-lg); padding: 0; width: min(420px, calc(100vw - 32px)); box-shadow: var(--sh-3); }
  dialog.confirm::backdrop { background: rgba(15,23,42,.45); backdrop-filter: blur(2px); }
  .confirm-body { padding: 22px 22px 8px; }
  .confirm-body h3 { margin: 0 0 6px; font-size: 18px; color: var(--ink); }
  .confirm-body p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
  .confirm-body .input { margin-top: 10px; }
  .confirm-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 16px 22px 20px; }
  .loading { text-align: center; padding: 80px 20px; color: var(--muted); font-weight: 600; }

  /* ---------- months, namelist, assignments, email ---------- */
  .agenda { grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); }
  .eyebrow { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; opacity: .85; margin-bottom: 4px; }
  .mrow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
  .msel { position: relative; display: inline-flex; }
  .msel select { appearance: none; -webkit-appearance: none; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.3); color: #fff; font-size: 24px; font-weight: 800; letter-spacing: -.01em; border-radius: 12px; padding: 4px 40px 4px 12px; cursor: pointer; max-width: 100%; }
  .msel select option { color: var(--ink); font-size: 15px; font-weight: 600; }
  .msel::after { content: "▾"; position: absolute; right: 14px; top: 50%; transform: translateY(-50%); pointer-events: none; font-size: 16px; }
  .hbtn { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 10px; border: none; background: rgba(255,255,255,.16); color: #fff; font-weight: 700; font-size: 14px; cursor: pointer; white-space: nowrap; }
  .hbtn:hover { background: rgba(255,255,255,.28); }
  .hbtn.icon { width: 36px; padding: 0; justify-content: center; }
  .hbtn:disabled { opacity: .4; cursor: default; }
  .hero .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }

  .layout.with-team { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 18px; align-items: start; }
  .team-panel { position: sticky; top: 76px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--sh-2); padding: 14px; max-height: calc(100vh - 96px); overflow: auto; }
  .tp-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .tp-head b { color: var(--ink); font-size: 16px; }
  .people { display: grid; gap: 6px; margin: 10px 0; }
  .person { display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 8px; border-radius: 12px; border: 1px solid var(--line); background: #fff; cursor: grab; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  .person:hover { border-color: var(--brand-200); }
  .person.picked { outline: 3px solid var(--brand); outline-offset: 1px; }
  .person .pn { flex: 1; min-width: 0; font-weight: 700; font-size: 14px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .person .pn small { display: block; font-weight: 500; font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
  .person .cnt { font-size: 11px; font-weight: 800; color: var(--muted); background: var(--surface-2); border-radius: 99px; padding: 1px 7px; }
  .person-edit { display: grid; gap: 6px; padding: 8px; border-radius: 12px; border: 2px solid var(--brand-200); background: var(--brand-50); }
  .add-person { display: grid; gap: 6px; padding-top: 10px; border-top: 1px solid var(--line); }
  .removed { margin-top: 10px; font-size: 13px; color: var(--muted); }
  .removed summary { cursor: pointer; font-weight: 700; }
  .removed .row { justify-content: space-between; padding: 4px 0; }
  .av { width: 26px; height: 26px; border-radius: 50%; color: #fff; font-size: 11px; font-weight: 800; display: grid; place-items: center; flex: 0 0 auto; letter-spacing: 0; }
  .av.sm { width: 20px; height: 20px; font-size: 9px; }
  .who { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
  .sess .who, .sess-edit .who { margin-top: 8px; }
  .pchip { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 9px 0 3px; border-radius: 99px; background: #fff; border: 1px solid var(--line); font-size: 12px; font-weight: 700; color: var(--ink); white-space: nowrap; }
  .pchip.inh { background: transparent; border-style: dashed; border-color: var(--line-2); }
  .pchip.gone { color: var(--muted); font-style: italic; }

/* =====================================================================

const T = (text, when = "", note = "") => ({ id: uid(), text, when, note, done: false, who: [] });

function normalize(d) {
  const s = clone(d || {});

  s.subtitle ??= "";

  if (!Array.isArray(s.months)) {
    const ym = ymNow();

  }
  delete s.days;
  const byName = new Map(s.people.map(p => [p.name.trim().toLowerCase(), p]));
  const personFor = name => {
    const key = name.trim().toLowerCase();
    if (!byName.has(key)) { const p = { id: "p_" + key.replace(/[^a-z0-9]+/g, "-"), name: name.trim(), email: "", archived: false }; s.people.push(p); byName.set(key, p); }

const count = ts => ({ done: ts.filter(t => t.done).length, total: ts.length });
const monthTasks = m => m.days.flatMap(dayTasks);
/* Every assignment in a month: [{ pid, kind: "lead"|"task", day, slot, sess, task }] */
function assignments(m) {
  const out = [];
  for (const day of m.days) {
    day.pre.forEach(t => t.who.forEach(pid => out.push({ pid, kind: "task", day, task: t })));
    for (const slot of day.slots) for (const sess of slot.sessions) {
      sess.who.forEach(pid => out.push({ pid, kind: "lead", day, slot, sess }));
      if (sess.setup) sess.tasks.forEach(t => effWho(t, sess).forEach(pid => out.push({ pid, kind: "task", day, slot, sess, task: t, inherited: !t.who.length })));
    }
  }
  return out;
}

/* Apply a change locally at once, then commit it to the shared store in a transaction. */
function mutate(fn, { defer = false } = {}) {
  if (!state) return;
  fn(state);
  if (defer) render.pending = true; else render();
  DB.tx(PATH, curDoc => { const s = curDoc ? normalize(curDoc) : clone(state); fn(s); s.updatedAt = Date.now(); return { write: s }; })
    .catch(showError);
}
function showError(e) {
  console.error(e);
  const msg = String(e?.message || e);
  toast(/permission|insufficient/i.test(msg)
    ? "Permission denied by Firestore. Publish the rules in firestore.rules (they include su_setup)."
    : "Couldn't save: " + msg, "err", 6000);
}

/* =====================================================================
   6. RENDER
   ===================================================================== */
const whenChip = t => t.when ? `<span class="chip">${icon("clock")}${esc(t.when)}</span>` : "";
const progChip = c => c.total ? `<span class="chip ${c.done === c.total ? "ok" : "warn"}">${c.done === c.total ? icon("check") : icon("flag")}Setup ${c.done}/${c.total}</span>` : `<span class="chip warn">${icon("flag")}Setup · no tasks yet</span>`;
const A = o => Object.entries(o).filter(([, v]) => v != null).map(([k, v]) => `data-${k}="${esc(v)}"`).join(" ");
const avatar = (p, sm) => `<span class="av${sm ? " sm" : ""}" style="background:${avColor(p.id)}">${esc(initials(p.name))}</span>`;
/* Assigned-name chips. With the Team panel or Edit mode open, each has a × to unassign.
   Inherited chips (a task falling back to its item's lead) are shown dashed, without ×. */
function whoChips(ids, kind, a, inherited = false) {
  const removable = (ui.team || ui.edit) && !inherited;
  return ids.map(pid => {
    const p = person(pid); if (!p) return "";
    return `<span class="pchip${p.archived ? " gone" : ""}${inherited ? " inh" : ""}" title="${esc(p.name)}${p.email ? " · " + esc(p.email) : ""}${inherited ? " · assigned as the lead. Drop a name here to give this task to someone else." : ""}">${avatar(p, true)}${esc(p.name)}${removable
      ? `<button data-act="unassign" ${A({ ...a, kind, p: pid })} title="Unassign ${esc(p.name)}" aria-label="Unassign ${esc(p.name)}">×</button>` : ""}</span>`;
  }).join("");
}
const dropHint = txt => ui.team || ui.pick ? `<span class="drop-hint">${txt}</span>` : "";

function render(force = false) {
  // Don't redraw under someone typing or dragging; redraw once they finish.
  if (!force && (fieldBusy || dragging)) { render.pending = true; return; }
  render.pending = false;
  if (!state) return;
  if (!cur()) setMonth(defaultMonth(), { quiet: true });
  const m = cur();
  document.title = `${m ? monthName(m) + " · " : ""}${state.title || "Induction Setup Checklist"}`;
  document.body.classList.toggle("picking", !!ui.pick);
  $("#conn").className = "conn" + (DB.mode === "local" ? " local" : "");
  $("#conn").innerHTML = `<span class="dot"></span>${DB.mode === "local" ? (localReason || "Demo mode (this browser only)") : "Live · shared with the team"}`;
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.v === ui.tab));
  const eb = $("#editBtn");
  eb.className = "btn" + (ui.edit ? " editing" : "");
  eb.innerHTML = ui.edit ? `${icon("check")}Done editing` : `${icon("edit")}Edit`;
  $("#teamBtn").classList.toggle("on", ui.team);
  $('[data-act="menu"]').innerHTML = icon("dots");
  if (!m) { $("#app").innerHTML = `<div class="loading">No months yet. <button class="btn primary" data-act="new-month">${icon("plus")}New month</button></div>`; return; }

  const pickP = ui.pick && person(ui.pick);
  const pickbar = pickP ? `<div class="pickbar">${avatar(pickP)}<span>Assigning <b>${esc(pickP.name)}</b>: tap agenda items or tasks to assign them. Tap a name chip's × to undo.</span><button class="btn sm" data-act="pick-done">Done</button></div>` : "";
  const editbar = ui.edit ? `<div class="editbar">${icon("edit")}<span>Edit mode: changes save automatically and everyone sees them straight away.</span></div>` : "";
  $("#app").innerHTML = pickbar + editbar + renderHero(m) +
    `<div class="layout${ui.team ? " with-team" : ""}"><div class="content">${ui.tab === "months" ? renderMonths() : ui.tab === "checklist" ? renderChecklist(m) : renderAgenda(m)}</div>${ui.team ? renderTeam(m) : ""}</div>`;
  if (render.focusKey) {
    const el = document.querySelector(`[data-key="${render.focusKey}"]`);
    render.focusKey = null;
    if (el) { el.focus(); if (el.select) el.select(); }
  }
}

function renderHero(m) {
  const list = sortedMonths(), i = list.findIndex(x => x.id === m.id), now = ymNow();
  const c = count(monthTasks(m));
  const pct = n => n.total ? Math.round(n.done / n.total * 100) : 0;
  const opt = x => `<option value="${esc(x.id)}" ${x.id === m.id ? "selected" : ""}>${esc(monthName(x))}${x.ym < now ? " (past)" : ""}</option>`;
  return `<section class="hero">
    <div>${ui.edit ? `<div class="edit-stack" style="margin-bottom:10px">
        <input class="input on-dark" data-edit="meta" data-f="title" value="${esc(state.title)}" placeholder="Page title">
        <input class="input on-dark" data-edit="meta" data-f="subtitle" value="${esc(state.subtitle)}" placeholder="Subtitle">
      </div>` : `<div class="eyebrow">${esc(state.title)}</div>`}
      <div class="mrow">
        <button class="hbtn icon" data-act="month-step" data-v="-1" ${i <= 0 ? "disabled" : ""} title="Previous month" aria-label="Previous month">${icon("left")}</button>
        <label class="msel"><select data-act="month-sel" aria-label="Month">${list.map(opt).join("")}</select></label>
        <button class="hbtn icon" data-act="month-step" data-v="1" ${i >= list.length - 1 ? "disabled" : ""} title="Next month" aria-label="Next month">${icon("right")}</button>
      </div>
      ${ui.edit ? "" : `<p>${esc(state.subtitle)}</p>`}
      <div class="acts">
        <button class="hbtn" data-act="email">${icon("mail")}Email draft</button>
        <button class="hbtn" data-act="new-month">${icon("plus")}New month</button>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><small>All setup</small><b>${c.done}/${c.total}</b><div class="bar"><i style="width:${pct(c)}%"></i></div></div>
      ${m.days.map(d => { const k = count(dayTasks(d)); return `<div class="stat"><small>${esc(d.name)}${d.date ? " · " + esc(d.date) : ""}</small><b>${k.done}/${k.total}</b><div class="bar"><i style="width:${pct(k)}%"></i></div></div>`; }).join("")}
    </div></section>`;
}

function renderTeam(m) {
  const counts = {};
  assignments(m).forEach(x => counts[x.pid] = (counts[x.pid] || 0) + 1);
  const rows = activePeople().map(p => ui.personEdit === p.id
    ? `<div class="person-edit">
        <input class="input" data-edit="person" ${A({ p: p.id })} data-f="name" data-key="pn-${p.id}" value="${esc(p.name)}" placeholder="Name">
        <input class="input" data-edit="person" ${A({ p: p.id })} data-f="email" type="email" value="${esc(p.email)}" placeholder="Email (for the email draft)">
        <div class="row"><button class="btn sm danger" data-act="person-remove" ${A({ p: p.id })}>${icon("trash")}Remove</button><div class="spacer"></div><button class="btn sm primary" data-act="person-edit" data-p="">Done</button></div>
      </div>`
    : `<div class="person${ui.pick === p.id ? " picked" : ""}" draggable="true" data-person="${esc(p.id)}" data-act="pick" ${A({ p: p.id })} title="Drag onto an agenda item or task, or tap then tap where it goes">
        ${avatar(p)}<span class="pn">${esc(p.name)}${p.email ? `<small>${esc(p.email)}</small>` : ""}</span>
        ${counts[p.id] ? `<span class="cnt" title="Assignments this month">${counts[p.id]}</span>` : ""}
        <button class="btn sm icon ghost" data-act="person-edit" ${A({ p: p.id })} title="Edit ${esc(p.name)}" aria-label="Edit ${esc(p.name)}">${icon("edit")}</button>
      </div>`).join("");
  const gone = state.people.filter(p => p.archived).sort((a, b) => a.name.localeCompare(b.name));
  return `<aside class="team-panel" aria-label="Namelist">
    <div class="tp-head"><b>👥 Namelist</b><span class="chip">${activePeople().length}</span><div class="spacer"></div>
      <button class="btn sm icon ghost" data-act="team" title="Close" aria-label="Close namelist">${icon("x")}</button></div>
    <p class="hint" style="margin:0">Drag a name onto an agenda item (as its lead) or a task. On a phone, tap a name, then tap where it goes.</p>
    <div class="people">${rows || `<p class="muted" style="font-size:14px;margin:0">No one yet. Add your team below.</p>`}</div>
    <form class="add-person" data-form="add-person">
      <input class="input" name="name" placeholder="Name" autocomplete="off" required maxlength="60">
      <input class="input" name="email" type="email" placeholder="Email (optional)" autocomplete="off" maxlength="120">
      <button class="btn sm primary">${icon("plus")}Add to namelist</button>
    </form>
    ${gone.length ? `<details class="removed"><summary>Removed (${gone.length})</summary>${gone.map(p => `<div class="row"><span>${esc(p.name)}</span><button class="btn sm" data-act="person-restore" ${A({ p: p.id })}>Restore</button></div>`).join("")}</details>` : ""}
  </aside>`;
}

function renderAgenda(m) {
  const legend = `<div class="legend">
    <span><span class="sw" style="background:var(--warn-50);border:2px solid var(--warn)"></span>Needs setup (to do)</span>
    <span><span class="sw" style="background:var(--ok-50);border:2px solid var(--ok)"></span>Setup done</span>
    <span><span class="sw" style="background:#fff;border:1px solid var(--line)"></span>No setup needed</span>
    ${ui.edit ? "" : `<span>Click a highlighted item to see its checklist.</span>`}</div>`;
  const days = m.days.map((d, di) => {
    const pre = count(d.pre);
    const head = ui.edit ? `<div class="day-head"><div class="day-edit">
        <div class="row"><input class="input on-dark" style="flex:1;min-width:120px" data-edit="day" ${A({ d: d.id })} data-f="name" value="${esc(d.name)}" placeholder="Day name">
          <input class="input on-dark" style="flex:1;min-width:120px" data-edit="day" ${A({ d: d.id })} data-f="date" value="${esc(d.date)}" placeholder="Date, e.g. Tue 3 Mar"></div>
        <div class="row"><div class="swatches">${DAY_COLORS.map(col => `<button data-act="day-color" ${A({ d: d.id, v: col })} class="${col === d.color ? "on" : ""}" style="background:${col}" title="Colour"></button>`).join("")}</div>
          <div class="spacer"></div>
          <button class="btn sm icon ghost" style="color:#fff" data-act="day-move" ${A({ d: d.id, v: -1 })} title="Move left" ${di === 0 ? "disabled" : ""}>${icon("left")}</button>
          <button class="btn sm icon ghost" style="color:#fff" data-act="day-move" ${A({ d: d.id, v: 1 })} title="Move right" ${di === m.days.length - 1 ? "disabled" : ""}>${icon("right")}</button>
          <button class="btn sm" data-act="slot-add" ${A({ d: d.id })}>${icon("plus")}Time block</button>
          <button class="btn sm danger" data-act="day-del" ${A({ d: d.id })}>${icon("trash")}Delete day</button></div>
      </div></div>`
      : `<div class="day-head"><h2>${esc(d.name)}</h2>${d.date ? `<span class="date">${esc(d.date)}</span>` : ""}</div>`;
    // The day's general setup list, shown (and tickable) at the top of the day.
    const preBox = d.pre.length ? `<div class="pre-box">
        <div class="pre-head">${pre.done === pre.total ? icon("check") : icon("flag")}<span>${esc(preTitle(d))} · general setup</span><span class="chip ${pre.done === pre.total ? "ok" : "brand"}">${pre.done}/${pre.total}</span>
          <div class="spacer"></div><button class="btn sm ghost" data-act="goto" ${A({ k: "pre-" + d.id })}>${ui.edit ? "Edit in Checklist" : "Open in Checklist"} ${icon("right")}</button></div>
        ${miniTasks({ d: d.id }, d.pre, null, true)}</div>`
      : ui.edit ? `<p class="hint" style="margin:12px 0 0">No general setup tasks for this day. Add them on the Checklist tab.</p>` : "";
    const slots = d.slots.map((sl, si) => `<div class="slot">
      <div class="pill">${ui.edit ? `<input class="input" data-edit="slot" ${A({ d: d.id, s: sl.id })} data-f="label" value="${esc(sl.label)}" placeholder="AM / PM / 9am">
          <button class="btn sm icon ghost" data-act="slot-move" ${A({ d: d.id, s: sl.id, v: -1 })} ${si === 0 ? "disabled" : ""} title="Move left">${icon("left")}</button>
          <button class="btn sm icon ghost" data-act="slot-move" ${A({ d: d.id, s: sl.id, v: 1 })} ${si === d.slots.length - 1 ? "disabled" : ""} title="Move right">${icon("right")}</button>
          <button class="btn sm icon ghost danger" data-act="slot-del" ${A({ d: d.id, s: sl.id })} title="Delete time block">${icon("trash")}</button>` : esc(sl.label)}</div>
      <div class="sess-list">
        ${sl.sessions.map((x, xi) => ui.edit ? sessEdit(d, sl, x, xi) : sessCard(d, sl, x)).join("") || (ui.edit ? "" : `<div class="empty-slot">Nothing scheduled</div>`)}
        ${ui.edit ? `<button class="btn sm dashed" data-act="sess-add" ${A({ d: d.id, s: sl.id })}>${icon("plus")}Add agenda item</button>` : ""}
      </div></div>`).join("");
    return `<section class="day" style="--day:${esc(d.color)}">${head}${preBox}
      <div class="slots" style="--n:${Math.max(1, Math.min(d.slots.length, 3))}">${slots || (ui.edit || !d.pre.length ? `<p class="muted">No time blocks yet.</p>` : "")}</div></section>`;
  }).join("");
  return legend + `<div class="agenda">${days || `<p class="muted">This month has no days yet. Click Edit, then Add a day.</p>`}${ui.edit ? `<button class="add-day" data-act="day-add"><span class="row">${icon("plus")}Add a day</span></button>` : ""}</div>`;
}
function sessCard(d, sl, x) {
  const ids = { d: d.id, s: sl.id, x: x.id };
  const meta = [x.time, x.venue].filter(Boolean).map(esc).join(" · ");
  const who = x.who.length ? `<span class="who">${whoChips(x.who, "sess", ids)}</span>` : (dropHint("Drop a lead here") ? `<span class="who">${dropHint("Drop a lead here")}</span>` : "");
  if (!x.setup) return `<div class="sess" data-drop="sess" ${A(ids)}>${esc(x.title)}${meta ? `<span class="meta">${meta}</span>` : ""}${who}</div>`;
  const c = count(x.tasks);
  return `<div role="button" tabindex="0" class="sess flag ${c.total && c.done === c.total ? "done" : ""}" data-act="goto" data-drop="sess" ${A({ ...ids, k: "ev-" + x.id })}>
    ${esc(x.title)}${meta ? `<span class="meta">${meta}</span>` : ""}<span class="badge">${progChip(c)}</span>${miniTasks(ids, x.tasks, x)}${who}</div>`;
}
/* The item's setup tasks, listed on its agenda card. They can be ticked right here.
   They are not drop targets: a name dropped anywhere on the card makes it the item's lead,
   which then covers every task that has no name of its own. */
function miniTasks(ids, tasks, x, dropTargets = false) {
  if (!tasks.length) return "";
  const names = t => effWho(t, x).map(person).filter(Boolean).map(p => p.name).join(", ");
  return `<ul class="mini">${tasks.map(t => {
    const a = { ...ids, t: t.id }, meta = [t.when, names(t)].filter(Boolean).map(esc).join(" · ");
    return `<li class="${t.done ? "done" : ""}"${dropTargets ? ` data-drop="task" ${A(a)}` : ""}><label><input type="checkbox" data-act="tick" ${A(a)} ${t.done ? "checked" : ""}>
      <span><span class="mt">${esc(t.text) || "<i>(untitled)</i>"}</span>${t.note ? `<small class="mnote">${esc(t.note)}</small>` : ""}${meta ? `<small>${meta}</small>` : ""}</span></label></li>`;
  }).join("")}</ul>`;
}
function sessEdit(d, sl, x, xi) {
  const ids = { d: d.id, s: sl.id, x: x.id };
  return `<div class="sess-edit ${x.setup ? "flag" : ""}" data-drop="sess" ${A(ids)}>
    <input class="input" data-edit="sess" ${A(ids)} data-f="title" data-key="t-${x.id}" value="${esc(x.title)}" placeholder="Agenda item">
    <div class="two"><input class="input" data-edit="sess" ${A(ids)} data-f="time" value="${esc(x.time)}" placeholder="Time">
      <input class="input" data-edit="sess" ${A(ids)} data-f="venue" value="${esc(x.venue)}" placeholder="Venue"></div>
    ${x.who.length || ui.team ? `<div class="who" style="margin-top:0">${whoChips(x.who, "sess", ids)}${x.who.length ? "" : dropHint("Drop a lead here")}</div>` : ""}
    <div class="row"><label class="toggle"><input type="checkbox" data-act="sess-setup" ${A(ids)} ${x.setup ? "checked" : ""}>${icon("flag")}Needs setup</label>
      <div class="spacer"></div>
      <button class="btn sm icon ghost" data-act="sess-move" ${A({ ...ids, v: -1 })} ${xi === 0 ? "disabled" : ""} title="Move up">${icon("up")}</button>
      <button class="btn sm icon ghost" data-act="sess-move" ${A({ ...ids, v: 1 })} ${xi === sl.sessions.length - 1 ? "disabled" : ""} title="Move down">${icon("down")}</button>
      <button class="btn sm icon ghost danger" data-act="sess-del" ${A(ids)} title="Delete">${icon("trash")}</button></div>
  </div>`;
}

function renderChecklist(m) {
  const inMonth = [...new Set(assignments(m).map(x => x.pid))].map(person).filter(Boolean).sort((a, b) => a.name.localeCompare(b.name));
  if (ui.owner && !inMonth.some(p => p.id === ui.owner)) ui.owner = "";
  const toolbar = ui.edit ? `<p class="hint" style="margin:0 0 14px">Add, edit, reorder and delete tasks below. To give an agenda item its own checklist, tick <b>Needs setup</b> on it in the Agenda tab. Open 👥 Team to assign people.</p>`
    : `<div class="toolbar">
      <div class="seg"><button data-act="filter" data-v="all" class="${ui.filter === "all" ? "on" : ""}">All tasks</button><button data-act="filter" data-v="todo" class="${ui.filter === "todo" ? "on" : ""}">Still to do</button></div>
      ${inMonth.length ? `<div class="seg"><button data-act="owner" data-v="" class="${!ui.owner ? "on" : ""}">Everyone</button>${inMonth.map(p => `<button data-act="owner" data-v="${esc(p.id)}" class="${ui.owner === p.id ? "on" : ""}">${esc(p.name)}</button>`).join("")}</div>` : ""}
    </div>`;
  // A person sees the tasks assigned to them, plus every task of an agenda item they lead.
  const visible = (t, x) => (ui.filter === "all" || !t.done) && (!ui.owner || t.who.includes(ui.owner) || !!x?.who.includes(ui.owner));
  const days = m.days.map(d => {
    const k = count(dayTasks(d));
    const blocks = [block(d, null, null, d.pre, visible)];
    d.slots.forEach(sl => sl.sessions.forEach(x => { if (x.setup) blocks.push(block(d, sl, x, x.tasks, visible)); }));
    const shown = blocks.filter(Boolean);
    return `<section class="cl-day" style="--day:${esc(d.color)}">
      <div class="cl-day-head"><h2><span class="dotc"></span>${esc(d.name)}${d.date ? ` <span class="muted" style="font-size:15px;font-weight:600">${esc(d.date)}</span>` : ""}</h2>
        <div class="progress"><i style="width:${k.total ? k.done / k.total * 100 : 0}%"></i></div><span class="chip ${k.total && k.done === k.total ? "ok" : ""}">${k.done}/${k.total} done</span></div>
      ${shown.join("") || `<div class="none-left">✓ Nothing left here${ui.owner ? ` for ${esc(person(ui.owner)?.name)}` : ""}.</div>`}</section>`;
  }).join("");
  return toolbar + days;
}
function block(d, sl, x, tasks, visible) {
  const ids = { d: d.id, s: sl?.id, x: x?.id };
  const list = ui.edit ? tasks : tasks.filter(t => visible(t, x));
  if (!ui.edit && !list.length && (ui.filter !== "all" || ui.owner)) return "";
  const c = count(tasks);
  const lead = x && (x.who.length || ui.team) ? `<span class="who"><span class="who-label">Lead</span>${whoChips(x.who, "sess", ids)}${x.who.length ? "" : dropHint("Drop a lead here")}</span>` : "";
  const head = x
    ? `<div class="block-head ev" data-drop="sess" ${A(ids)}><span class="slot-tag">${esc(sl.label)}</span><h3>${esc(x.title)}</h3>${x.time || x.venue ? `<span class="muted" style="font-size:13px;font-weight:600">${[x.time, x.venue].filter(Boolean).map(esc).join(" · ")}</span>` : ""}${lead}<div class="spacer"></div>${progChip(c)}</div>`
    : `<div class="block-head pre">${icon("flag")}<h3>${esc(preTitle(d))} · general setup</h3><div class="spacer"></div><span class="chip ${c.total && c.done === c.total ? "ok" : "brand"}">${c.done}/${c.total}</span></div>`;
  const rows = list.map((t, i) => ui.edit ? taskEdit(ids, t, i, tasks.length, x) : taskRow(ids, t, x)).join("")
    || `<div class="empty">${ui.edit ? "No tasks yet." : "No setup tasks listed yet. Click Edit to add some."}</div>`;
  return `<div class="block" id="${x ? "ev-" + x.id : "pre-" + d.id}">${head}<ul class="tasks">${rows}</ul>
    ${ui.edit ? `<div class="block-foot"><button class="btn sm dashed" data-act="task-add" ${A(ids)}>${icon("plus")}Add task</button></div>` : ""}</div>`;
}
const taskChips = (t, x, a) => t.who.length ? whoChips(t.who, "task", a) : whoChips(x?.who || [], "task", a, true);
function taskRow(ids, t, x) {
  const cb = `task-${t.id}`, a = { ...ids, t: t.id };
  return `<li class="task ${t.done ? "done" : ""}" data-drop="task" ${A(a)}>
    <input type="checkbox" id="${cb}" data-act="tick" ${A(a)} ${t.done ? "checked" : ""}>
    <label for="${cb}"><div class="txt">${esc(t.text) || "<i>(untitled)</i>"}</div>${t.note ? `<div class="note">${esc(t.note)}</div>` : ""}</label>
    <div class="tags">${whenChip(t)}${taskChips(t, x, a)}</div></li>`;
}
function taskEdit(ids, t, i, n, x) {
  const a = { ...ids, t: t.id };
  return `<li class="task-edit" data-drop="task" ${A(a)}>

/* Build the email for a month: { to, subject, html, text } */
function buildEmail(m, { intro, outro, todoOnly, byPerson }) {
  const P = id => person(id);
  const names = ids => ids.map(P).filter(Boolean).map(p => p.name).join(", ");
  const dates = m.days.map(d => d.date ? `${d.name} ${d.date}` : "").filter(Boolean).join(", ");
  const link = `${location.origin}${location.pathname}?month=${encodeURIComponent(m.id)}`;
  const keep = t => !todoOnly || !t.done;
  const days = m.days.map(d => {
    const groups = [];
    const pre = d.pre.filter(keep);
    if (pre.length) groups.push({ title: preTitle(d), sub: "", lead: "", tasks: pre, sess: null });
    d.slots.forEach(sl => sl.sessions.forEach(x => {
      if (!x.setup) return;
      const ts = x.tasks.filter(keep);
      if (ts.length || x.who.length) groups.push({ title: `${sl.label} · ${x.title}`, sub: [x.time, x.venue].filter(Boolean).join(", "), lead: names(x.who), tasks: ts, sess: x });
    }));
    return { title: `${d.name}${d.date ? " – " + d.date : ""}`, groups };
  }).filter(d => d.groups.length);

  const people = new Map();
  if (byPerson) for (const a of assignments(m)) {
    if (a.kind === "task" && !keep(a.task)) continue;
    const p = P(a.pid); if (!p) continue;
    const where = `${a.day.name}${a.sess ? `, ${a.slot.label} ${a.sess.title}` : ", before the day"}`;
    const item = a.kind === "lead" ? `Lead for ${a.sess.title} (${a.day.name} ${a.slot.label})` : `${a.task.text}${a.task.when ? ` – ${a.task.when}` : ""} (${where})`;
    if (!people.has(p.id)) people.set(p.id, { p, items: [] });
    people.get(p.id).items.push(item);
  }
  const ppl = [...people.values()].sort((a, b) => a.p.name.localeCompare(b.p.name));
  const to = [...new Set(assignments(m).map(a => P(a.pid)?.email?.trim()).filter(Boolean))];
  const subject = `Induction setup: ${monthName(m)}${dates ? ` (${dates})` : ""}`;

  const F = "font-family:Arial,Helvetica,sans-serif;";
  const para = s => esc(s).replace(/\n/g, "<br>");
  const td = "border:1px solid #cfdbe0;padding:6px 8px;vertical-align:top;font-size:14px;";
  let html = `<div style="${F}font-size:14px;color:#1e293b;line-height:1.5">`;
  if (intro.trim()) html += `<p>${para(intro.trim())}</p>`;
  for (const d of days) {
    html += `<h2 style="${F}font-size:18px;color:#0f3a50;margin:22px 0 8px">${esc(d.title)}</h2>`;
    for (const g of d.groups) {
      html += `<p style="margin:14px 0 6px"><b>${esc(g.title)}</b>${g.sub ? ` <span style="color:#64748b">(${esc(g.sub)})</span>` : ""}${g.lead ? `<br><span style="color:#64748b">Lead: ${esc(g.lead)}</span>` : ""}</p>`;
      if (g.tasks.length) html += `<table style="border-collapse:collapse;width:100%;${F}"><tr style="background:#eef6fa"><th style="${td}text-align:left">Task</th><th style="${td}text-align:left;width:22%">When</th><th style="${td}text-align:left;width:22%">Who</th></tr>${g.tasks.map(t =>
        `<tr><td style="${td}">${esc(t.text)}${t.note ? `<br><span style="color:#64748b;font-size:13px">${para(t.note)}</span>` : ""}</td><td style="${td}">${esc(t.when) || "&nbsp;"}</td><td style="${td}">${esc(names(effWho(t, g.sess))) || `<span style="color:#b45309">To be assigned</span>`}</td></tr>`).join("")}</table>`;
    }
  }
  if (!days.length) html += `<p><i>No setup tasks ${todoOnly ? "left " : ""}for this month.</i></p>`;
  if (ppl.length) {
    html += `<h2 style="${F}font-size:18px;color:#0f3a50;margin:22px 0 8px">Who's doing what</h2>`;
    for (const { p, items } of ppl) html += `<p style="margin:10px 0 4px"><b>${esc(p.name)}</b></p><ul style="margin:0 0 0 18px;padding:0">${items.map(i => `<li>${esc(i)}</li>`).join("")}</ul>`;
  }
  html += `<p style="margin-top:20px">Live checklist (tick tasks off as you finish them): <a href="${esc(link)}">${esc(link)}</a></p>`;
  if (outro.trim()) html += `<p>${para(outro.trim())}</p>`;
  html += `</div>`;

  let text = intro.trim() ? intro.trim() + "\n\n" : "";
  for (const d of days) {
    text += `${d.title.toUpperCase()}\n`;
    for (const g of d.groups) {
      text += `\n${g.title}${g.sub ? ` (${g.sub})` : ""}${g.lead ? `\nLead: ${g.lead}` : ""}\n`;
      for (const t of g.tasks) text += `- ${t.text}${t.when ? ` – ${t.when}` : ""} – ${names(effWho(t, g.sess)) || "to be assigned"}\n`;
    }
    text += "\n";
  }
  if (ppl.length) { text += "WHO'S DOING WHAT\n"; for (const { p, items } of ppl) text += `\n${p.name}\n${items.map(i => "- " + i).join("\n")}\n`; text += "\n"; }
  text += `Live checklist: ${link}\n`;
  if (outro.trim()) text += `\n${outro.trim()}\n`;
  return { to, subject, html, text };
}

async function copyRich(html, text) {
  try {
    await navigator.clipboard.write([new ClipboardItem({ "text/html": new Blob([html], { type: "text/html" }), "text/plain": new Blob([text], { type: "text/plain" }) })]);
    return true;
  } catch {
    const div = document.createElement("div");
    div.contentEditable = "true"; div.innerHTML = html;
    div.style.cssText = "position:fixed;left:-9999px;top:0;background:#fff";
    document.body.appendChild(div);
    const r = document.createRange(); r.selectNodeContents(div);
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
    let ok = false; try { ok = document.execCommand("copy"); } catch {}
    sel.removeAllRanges(); div.remove();
    return ok;
  }
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; }
  catch { const a = document.createElement("textarea"); a.value = t; document.body.appendChild(a); a.select(); let ok = false; try { ok = document.execCommand("copy"); } catch {} a.remove(); return ok; }
}
/* An .eml file with X-Unsent: 1 opens in Outlook as a new, editable, unsent message. */
function emlFile(to, subject, html) {
  const b64 = s => btoa(unescape(encodeURIComponent(s)));
  const body = b64(`<!doctype html><html><head><meta charset="utf-8"></head><body>${html}</body></html>`).replace(/.{76}/g, "$&\r\n");
  return ["X-Unsent: 1", `To: ${to}`, `Subject: =?UTF-8?B?${b64(subject)}?=`, "MIME-Version: 1.0",
    "Content-Type: text/html; charset=UTF-8", "Content-Transfer-Encoding: base64", "", body, ""].join("\r\n");
}
function download(name, content, type) {
  const link = document.createElement("a");
  link.href = URL.createObjectURL(new Blob([content], { type }));
  link.download = name; link.click();
  setTimeout(() => URL.revokeObjectURL(link.href), 1500);
}

function emailDialog(mid) {
  const m = state.months.find(x => x.id === (mid || ui.month));

    outro: "Thanks!", todoOnly: false, byPerson: true,
  };
  const first = buildEmail(m, opts);
  const noEmail = [...new Set(assignments(m).map(a => person(a.pid)).filter(p => p && !p.email?.trim()).map(p => p.name))];
  const d = dialog("wide", `<form>
    <div class="dlg-head">${icon("mail")}<h3>Email draft · ${esc(monthName(m))}</h3><div class="spacer"></div><button type="button" class="btn sm icon ghost" data-close aria-label="Close">${icon("x")}</button></div>
    <div class="dlg-body"><div class="email-grid">
      <div style="display:grid;gap:10px">

        ${noEmail.length ? `<p class="hint" style="margin:-4px 0 0;color:var(--warn-600)">No email saved for: ${esc(noEmail.join(", "))}. Add emails in 👥 Team.</p>` : ""}
        <label class="f">Subject<input class="input" name="subject" value="${esc(first.subject)}"></label>
        <label class="f">Opening<textarea class="textarea" name="intro" style="min-height:130px">${esc(opts.intro)}</textarea></label>
        <label class="f">Sign-off<textarea class="textarea" name="outro" style="min-height:50px">${esc(opts.outro)}</textarea></label>
        <label class="check"><input type="checkbox" name="byPerson" checked>Add a "Who's doing what" list per person</label>
        <label class="check"><input type="checkbox" name="todoOnly">Only include tasks not yet ticked</label>
      </div>
      <div><div class="preview-label">Preview</div><div class="preview" id="emailPreview"></div></div>
    </div></div>
    <div class="dlg-foot">
      <button type="button" class="btn" data-act="em-to">${icon("copy")}Copy To addresses</button>
      <button type="button" class="btn" data-act="em-mailto">Open in email app</button>
      <button type="button" class="btn" data-act="em-eml">⬇ Outlook draft (.eml)</button>
      <button type="button" class="btn primary" data-act="em-copy">${icon("copy")}Copy email</button>
    </div>
    <p class="hint" style="margin:0 22px 18px;text-align:right">Copy email, then paste it into a new Outlook message. Or download the Outlook draft and open it: Outlook opens it as a new email, ready to send.</p>
  </form>`);
  const f = d.querySelector("form");
  let em = first;
  const build = () => {
    em = buildEmail(m, { intro: f.intro.value, outro: f.outro.value, todoOnly: f.todoOnly.checked, byPerson: f.byPerson.checked });
    d.querySelector("#emailPreview").innerHTML = `<div style="font:13px Arial,sans-serif;color:#64748b;margin-bottom:10px;border-bottom:1px solid #e2e8f0;padding-bottom:8px"><b>Subject:</b> ${esc(f.subject.value)}</div>` + em.html;
  };
  f.addEventListener("input", e => { if (e.target.name !== "to" && e.target.name !== "subject") build(); else if (e.target.name === "subject") build(); });
  f.addEventListener("change", build);
  f.addEventListener("submit", e => e.preventDefault());
  build();
  const toStr = () => f.to.value.split(/[;,\n]/).map(s => s.trim()).filter(Boolean).join("; ");
  d.addEventListener("click", async e => {
    const act = e.target.closest("[data-act]")?.dataset.act;
    if (!act?.startsWith("em-")) return;
    if (act === "em-copy") { const ok = await copyRich(em.html, em.text); toast(ok ? "Email copied. Paste it into a new message." : "Couldn't copy. Select the preview and copy it instead.", ok ? "ok" : "err"); }
    if (act === "em-to") toast(await copyText(toStr()) ? "Addresses copied." : "Couldn't copy.", "ok");

      if (url.length > 1900) toast("This email is long, so some email apps may cut it short. If that happens, use Copy email instead.", "info", 6000);
      location.href = url;
    }
  });
}

const ds = el => ({ d: el.dataset.d, s: el.dataset.s, x: el.dataset.x, t: el.dataset.t, v: el.dataset.v, p: el.dataset.p, m: el.dataset.m, kind: el.dataset.kind });
const closeMenu = () => { $("#menu").hidden = true; };

function assign(el, pid) {
  const a = ds(el), kind = el.dataset.drop, mid = ui.month, p = person(pid);
  if (!p) return;
  const c = ctx(state, mid, a), tgt = kind === "task" ? c.task : c.sess;
  if (!tgt) return;
  if (tgt.who.includes(pid)) return toast(`${p.name} is already on that.`, "info", 1800);
  mutate(s => { const c2 = ctx(s, mid, a), t2 = kind === "task" ? c2.task : c2.sess; if (t2 && !t2.who.includes(pid)) t2.who.push(pid); });
  const own = kind === "sess" && tgt.setup ? tgt.tasks.filter(t => !t.who.length).length : 0;
  toast(`${p.name} → ${kind === "task" ? tgt.text || "task" : `${tgt.title || "agenda item"} (lead)`}${own ? `, and its ${own} task${own === 1 ? "" : "s"} without a name` : ""}`, "ok", 2200);
}

// Tap-to-assign: while a name is picked, tapping an agenda item or task assigns it (instead of ticking or opening).
document.addEventListener("click", e => {
  if (!ui.pick) return;
  if (e.target.closest(".team-panel, .pickbar, [data-act='unassign'], header, dialog")) return;
  const tgt = e.target.closest("[data-drop]");
  if (!tgt) return;
  if (ui.edit && e.target.closest("input, button, select")) return;
  e.preventDefault(); e.stopPropagation();
  assign(tgt, ui.pick);
}, true);

document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]");
  if (!$("#menu").hidden && !e.target.closest(".menu")) closeMenu();
  if (!el || el.disabled || el.closest("dialog")) return;
  const act = el.dataset.act, a = ds(el), mid = ui.month;
  if (act === "tick" || act === "sess-setup" || act === "month-sel") return; // handled on change
  switch (act) {
    case "tab": ui.tab = a.v; store("tab", a.v); render(); window.scrollTo(0, 0); break;
    case "menu": $("#menu").hidden = !$("#menu").hidden; break;
    case "team": ui.team = !ui.team; store("team", ui.team ? "1" : "0"); if (!ui.team) { ui.pick = ""; ui.personEdit = ""; } render(); break;
    case "edit":
      if (!ui.edit && !unlocked) {
        const pin = await ask("Enter edit PIN", "Editing is locked with a PIN.", { ok: "Unlock", input: "" });
        if (pin === false) return;
        if (pin !== EDIT_PIN) return toast("Wrong PIN.", "err");
        unlocked = true; try { sessionStorage.setItem("susetup:pin", EDIT_PIN); } catch {}
      }
      ui.edit = !ui.edit; render(); break;
    case "filter": ui.filter = a.v; render(); break;
    case "owner": ui.owner = a.v; render(); break;
    case "goto": {
      if (e.target.closest("[data-act='unassign'], .mini")) return;
      ui.tab = "checklist"; store("tab", "checklist"); ui.filter = "all"; ui.owner = ""; render();
      const b = document.getElementById(el.dataset.k);
      if (b) { b.scrollIntoView({ behavior: "smooth", block: "start" }); b.classList.remove("hl"); void b.offsetWidth; b.classList.add("hl"); }
      break;
    }
    case "month-step": { const list = sortedMonths(), i = list.findIndex(m => m.id === mid), n = list[i + +a.v]; if (n) setMonth(n.id); break; }
    case "month-open": setMonth(a.m); ui.tab = "agenda"; store("tab", "agenda"); render(); window.scrollTo(0, 0); break;
    case "new-month": closeMenu(); newMonthDialog(a.m); break;
    case "email": closeMenu(); emailDialog(a.m); break;
    case "month-del": {
      const m = mon(state, a.m);
      if (state.months.length <= 1) return toast("You need at least one month.", "info");
      if (!await ask(`Delete ${monthName(m)}?`, "This deletes the month's agenda, tasks and ticks for everyone. Other months aren't affected.", { ok: "Delete", danger: true })) return;
      mutate(s => { s.months = s.months.filter(x => x.id !== a.m); });
      if (a.m === ui.month) setMonth(defaultMonth());
      break;
    }
    // namelist
    case "pick": {
      if (e.target.closest("button")) return;
      ui.pick = ui.pick === a.p ? "" : a.p; render(); break;
    }
    case "pick-done": ui.pick = ""; render(); break;
    case "person-edit": ui.personEdit = a.p || ""; if (a.p) render.focusKey = "pn-" + a.p; render(); break;
    case "person-remove": {
      const p = person(a.p);
      if (!await ask(`Remove ${p.name} from the namelist?`, "They stay on anything already assigned, so past months still show who did what. You can restore them later.", { ok: "Remove" })) return;
      ui.personEdit = ""; if (ui.pick === a.p) ui.pick = "";
      mutate(s => { const q = s.people.find(x => x.id === a.p); if (q) q.archived = true; }); break;
    }
    case "person-restore": mutate(s => { const q = s.people.find(x => x.id === a.p); if (q) q.archived = false; }); break;
    case "unassign": mutate(s => { const c = ctx(s, mid, a), tgt = a.kind === "task" ? c.task : c.sess; if (tgt) tgt.who = tgt.who.filter(id => id !== a.p); }); break;
    // agenda
    case "day-add": {
      const id = uid(), n = cur().days.length + 1;
      mutate(s => mon(s, mid)?.days.push({ id, name: `Day ${n}`, date: "", color: DAY_COLORS[(n - 1) % DAY_COLORS.length], pre: [],
        slots: [{ id: id + "a", label: "AM", sessions: [] }, { id: id + "p", label: "PM", sessions: [] }] }));
      break;
    }
    case "day-del": {
      const d = ctx(state, mid, a).day;
      if (!await ask(`Delete ${d.name}?`, "This removes the day, its agenda items and all its setup tasks from this month.", { ok: "Delete", danger: true })) return;
      mutate(s => { const m = mon(s, mid); if (m) m.days = m.days.filter(x => x.id !== a.d); }); break;
    }
    case "day-move": mutate(s => { const m = mon(s, mid); if (m) move(m.days, m.days.findIndex(x => x.id === a.d), +a.v); }); break;
    case "day-color": mutate(s => { const d = ctx(s, mid, a).day; if (d) d.color = a.v; }); break;
    case "slot-add": { const id = uid(); mutate(s => ctx(s, mid, a).day?.slots.push({ id, label: "PM", sessions: [] })); break; }
    case "slot-move": mutate(s => { const d = ctx(s, mid, a).day; if (d) move(d.slots, d.slots.findIndex(x => x.id === a.s), +a.v); }); break;
    case "slot-del": {
      const sl = ctx(state, mid, a).slot;
      if (sl.sessions.length && !await ask(`Delete the ${sl.label} block?`, `It has ${sl.sessions.length} agenda item(s), which will be deleted too.`, { ok: "Delete", danger: true })) return;
      mutate(s => { const d = ctx(s, mid, a).day; if (d) d.slots = d.slots.filter(x => x.id !== a.s); }); break;
    }
    case "sess-add": { const id = uid(); render.focusKey = "t-" + id; mutate(s => ctx(s, mid, a).slot?.sessions.push({ id, title: "", time: "", venue: "", setup: false, who: [], tasks: [] })); break; }
    case "sess-move": mutate(s => { const sl = ctx(s, mid, a).slot; if (sl) move(sl.sessions, sl.sessions.findIndex(x => x.id === a.x), +a.v); }); break;
    case "sess-del": {
      const x = ctx(state, mid, a).sess;
      if ((x.tasks.length || x.title) && !await ask(`Delete "${x.title || "this item"}"?`, x.tasks.length ? `Its ${x.tasks.length} setup task(s) will be deleted too.` : "It will be removed from the agenda.", { ok: "Delete", danger: true })) return;
      mutate(s => { const sl = ctx(s, mid, a).slot; if (sl) sl.sessions = sl.sessions.filter(y => y.id !== a.x); }); break;
    }
    case "task-add": { const id = uid(); render.focusKey = "k-" + id; mutate(s => ctx(s, mid, a).list?.push({ id, text: "", when: "", note: "", done: false, who: [] })); break; }
    case "task-move": mutate(s => { const l = ctx(s, mid, a).list; if (l) move(l, l.findIndex(t => t.id === a.t), +a.v); }); break;
    case "task-del": mutate(s => { const l = ctx(s, mid, a).list; const i = l ? l.findIndex(t => t.id === a.t) : -1; if (i >= 0) l.splice(i, 1); }); break;
    // menu
    case "untick":
      closeMenu();
      if (!await ask(`Untick everything in ${monthName(cur())}?`, "Clears every tick in this month. Tasks, names and the agenda stay as they are. Other months aren't affected.", { ok: "Untick all" })) return;
      mutate(s => mon(s, mid)?.days.forEach(d => { d.pre.forEach(t => t.done = false); d.slots.forEach(sl => sl.sessions.forEach(x => x.tasks.forEach(t => t.done = false))); }));
      toast("All ticks cleared for this month."); break;
    case "guide": location.href = "setup-guide.html"; break;
    case "print": closeMenu(); ui.tab = "checklist"; ui.edit = false; ui.filter = "all"; ui.owner = ""; ui.team = false; render(); setTimeout(() => print(), 50); break;
    case "export": closeMenu(); download(`induction-setup-backup-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(state, null, 2), "application/json"); break;
    case "import": closeMenu(); $("#importFile").click(); break;
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && ui.pick) { ui.pick = ""; render(); }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches?.('[role="button"][data-act]')) { e.preventDefault(); e.target.click(); }
  if (e.key === "Enter" && e.target.matches?.("#app input.input") && !e.target.closest("form")) e.target.blur();
});

document.addEventListener("change", e => {
  const el = e.target, a = ds(el), mid = ui.month;
  if (el.closest("dialog")) return;
  if (el.dataset.act === "month-sel") return setMonth(el.value);
  if (el.dataset.act === "tick") {
    mutate(s => { const t = ctx(s, mid, a).task; if (t) t.done = el.checked; });
  } else if (el.dataset.act === "sess-setup") {
    mutate(s => { const x = ctx(s, mid, a).sess; if (x) x.setup = el.checked; });
  } else if (el.dataset.edit) {
    const f = el.dataset.f, v = el.value.trim();
    if (el.dataset.edit === "month" && f === "ym" && !isYM(v)) return toast("Pick a month.", "err");
    if (el.dataset.edit === "person" && f === "name" && !v) return toast("A name can't be empty.", "err");
    mutate(s => {
      const c = () => ctx(s, mid, a);
      const target = { meta: () => s, month: () => mon(s, a.m), person: () => s.people.find(p => p.id === a.p),
        day: () => c().day, slot: () => c().slot, sess: () => c().sess, task: () => c().task }[el.dataset.edit]?.();
      if (target) target[f] = v;
    }, { defer: true }); // redrawn on focusout, once focus has landed on the next field
  }
});

document.addEventListener("submit", e => {
  const f = e.target.closest("[data-form='add-person']");
  if (!f) return;
  e.preventDefault();
  const name = f.elements.name.value.trim().replace(/\s+/g, " "), email = f.elements.email.value.trim();
  if (!name) return;
  const existing = state.people.find(p => p.name.toLowerCase() === name.toLowerCase());
  if (existing && !existing.archived) return toast(`${existing.name} is already on the namelist.`, "info");
  const id = existing ? existing.id : "p_" + uid();
  mutate(s => {
    const q = s.people.find(p => p.id === id);
    if (q) { q.archived = false; if (email) q.email = email; }
    else s.people.push({ id, name, email, archived: false });
  });
  toast(existing ? `Restored ${name}.` : `Added ${name}.`, "ok", 1600);
  render(true);
  $("[data-form='add-person'] [name=name]")?.focus();
});

// fieldBusy stays true from focusing a field until focus has settled somewhere else (a redraw
// in between, e.g. from a live update, would otherwise throw away the field the user tabbed to).
let fieldBusy = false, dragging = false;
document.addEventListener("focusin", e => { if (e.target.matches?.("#app input.input")) fieldBusy = true; });
/* Redraw now if anything changed meanwhile, then put focus back on the field the user is in. */
function flush() {
  const ae = document.activeElement;
  fieldBusy = !!ae?.matches?.("#app input.input");
  if (!render.pending) return;
  const key = fieldBusy ? keyOf(ae) : null;
  render(true);
  if (key) document.querySelector(key)?.focus();
}
document.addEventListener("focusout", () => setTimeout(flush, 0));
const keyOf = el => "#app " + (el.name && el.closest("form") ? `form [name="${el.name}"]` : ["edit", "f", "d", "s", "x", "t", "p", "m"].filter(k => el.dataset[k]).map(k => `[data-${k}="${CSS.escape(el.dataset[k])}"]`).join(""));

// Drag and drop names from the namelist
const MIME = "application/x-setup-person";
let dragPid = "";
document.addEventListener("dragstart", e => {
  const p = e.target.closest?.("[data-person]");
  if (!p) return;
  dragging = true; dragPid = p.dataset.person;
  e.dataTransfer.setData(MIME, dragPid);
  e.dataTransfer.setData("text/plain", person(dragPid)?.name || "");
  e.dataTransfer.effectAllowed = "copy";
});
document.addEventListener("dragend", () => {
  dragging = false; dragPid = "";
  document.querySelectorAll(".drop-over").forEach(x => x.classList.remove("drop-over"));
  flush(); // a field (e.g. the add-person box) may still have focus
});
document.addEventListener("dragover", e => {
  if (!dragPid) return;
  const t = e.target.closest?.("[data-drop]");
  document.querySelectorAll(".drop-over").forEach(x => { if (x !== t) x.classList.remove("drop-over"); });
  if (!t) return;
  e.preventDefault(); e.dataTransfer.dropEffect = "copy";
  t.classList.add("drop-over");
});
document.addEventListener("drop", e => {
  const t = e.target.closest?.("[data-drop]");
  const pid = e.dataTransfer.getData(MIME) || dragPid;
  if (!t || !pid) return;
  e.preventDefault();
  t.classList.remove("drop-over");
  assign(t, pid);
});

$("#importFile").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = "";
  if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!Array.isArray(data.months) && !Array.isArray(data.days)) throw new Error("This file isn't a setup checklist backup.");
    const n = normalize(data);
    if (!await ask("Import this backup?", `Replaces everything (${n.months.length} month(s), ${n.people.length} people on the namelist) for everyone.`, { ok: "Import", danger: true })) return;
    mutate(s => { Object.keys(s).forEach(k => delete s[k]); Object.assign(s, clone(n)); });
    setMonth(defaultMonth());
    toast("Imported.");
  } catch (err) { toast(String(err.message || err), "err"); }
});

/* =====================================================================
   9. START
   ===================================================================== */
function onData(d) {
  if (!d) {
    if (!seeded) { seeded = true; DB.tx(PATH, c => c ? {} : { write: freshState() }).catch(onErr); }
    return;
  }
  state = normalize(d); render();
}
function onErr(e) {
  console.error(e);
  if (DB.mode === "firebase") {
    localReason = /permission|insufficient/i.test(String(e?.message || e))
      ? "Demo mode: Firestore rules not published yet" : "Demo mode: couldn't reach Firebase";
    toast(localReason + ". Changes are saved in this browser only.", "err", 7000);
    unsub?.(); DB = makeLocalStore(); seeded = false; unsub = DB.watchDoc(PATH, onData, onErr);
  } else showError(e);
}
(async () => {
  try { DB = USE_FIREBASE ? await makeFirebaseStore() : makeLocalStore(); }
  catch (e) { console.error(e); DB = makeLocalStore(); localReason = "Demo mode: couldn't load Firebase"; }
  unsub = DB.watchDoc(PATH, onData, onErr);
})();
</script>
